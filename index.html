<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiki Race</title>
<meta name="description" content="Race through Wikipedia from one article to another using only links. Categories, daily challenge, funny twists and live multiplayer.">
<meta name="theme-color" content="#1d2321">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d2321'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' text-anchor='middle' fill='%23f08a4b'%3EW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Wiki Race.
   Layout: slim sticky header. Home is one column of sections (pair hero, daily + friends cards, pair picker, mode, twists, options).
   Race: article column + sticky side panel on desktop; phone gets a bottom bar and a sheet.
   The Wikipedia article is printed on light paper in both themes so Wikipedia's own coloured tables stay readable. */
:root{
  --bg:#e9ece5; --panel:#fbfbf8; --ink:#1d2321; --muted:#5f6964; --line:#d3d9d0; --chip:#e1e6dd;
  --accent:#b4441c; --accent-ink:#ffffff; --good:#1f7a4d; --warn:#9a5b00; --bad:#b3261e;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.06);
  --cat-s:62%; --cat-l:89%; --cat-ink-l:24%;
  --cold:#2f6fb3; --warm:#b07a00; --hot:#d2531b; --burn:#c0182b;
  /* article paper, fixed light */
  --a-bg:#ffffff; --a-ink:#202122; --a-muted:#54595d; --a-line:#c8ccd1; --a-head:#eaecf0; --a-link:#2a5db0; --a-tint:#f8f9fa;
  --display:"Fraunces",Georgia,serif; --body:"Source Serif 4",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --panel:#1a1f1d; --ink:#e6eae7; --muted:#9aa49f; --line:#2c3431; --chip:#252c29;
  --accent:#f08a4b; --accent-ink:#1a1f1d; --good:#5cc08b; --warn:#e2a64a; --bad:#ff8a80;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --cat-s:30%; --cat-l:21%; --cat-ink-l:84%;
  --cold:#7fb2ec; --warm:#f0c454; --hot:#ff9a5c; --burn:#ff6b7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --panel:#1a1f1d; --ink:#e6eae7; --muted:#9aa49f; --line:#2c3431; --chip:#252c29;
  --accent:#f08a4b; --accent-ink:#1a1f1d; --good:#5cc08b; --warn:#e2a64a; --bad:#ff8a80;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --cat-s:30%; --cat-l:21%; --cat-ink-l:84%;
  --cold:#7fb2ec; --warm:#f0c454; --hot:#ff9a5c; --burn:#ff6b7a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);-webkit-text-size-adjust:100%}
body.modal-open{overflow:hidden}
a{color:inherit}
button,input,select,textarea{font:500 13px var(--mono);color:var(--ink)}
button{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;min-height:40px;line-height:1.2}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.go:hover{filter:brightness(1.06);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button.danger{color:var(--bad)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],select,textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-height:40px;font-size:16px}
textarea{font:15px/1.5 var(--sans);width:100%;resize:vertical}
.eyebrow{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.em{font-size:24px;line-height:1}

/* ---------- Header ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.logo{font:700 19px var(--display);white-space:nowrap;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0;min-height:0}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--accent);font:700 17px var(--display);font-style:normal}
.tools{margin-left:auto;display:flex;gap:6px}
.tools button{padding:6px 10px;min-height:36px}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid transparent;border-radius:999px;padding:4px 10px 4px 4px;min-height:40px;text-align:left;font:inherit;color:inherit}
.chip img,.chip .noimg{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
.chip .noimg{display:grid;place-items:center;font-size:15px}
.chip img.blur{filter:blur(4px)}
.chip span.t{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.chip small{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}
.chip b{font:600 15px var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud{display:flex;gap:12px;align-items:center;font:500 15px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .n{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.hud small{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hud .n.low b{color:var(--bad)}
.temp{font:600 12px var(--mono);border-radius:999px;padding:5px 9px;white-space:nowrap;background:var(--chip);color:var(--ink);transition:background .3s}
.temp.l0{color:var(--cold)} .temp.l1{color:var(--warm)} .temp.l2{color:var(--hot)} .temp.l3{color:var(--burn)}
.temp.pulse{animation:pulse .6s ease}
@keyframes pulse{50%{transform:scale(1.15)}}
.roomtag{font:600 12px var(--mono);background:var(--chip);border-radius:999px;padding:5px 9px;white-space:nowrap}
.loadbar{height:2px;background:var(--accent);transform-origin:left;transform:scaleX(0);opacity:0}
body.loading .loadbar{opacity:1;animation:load 1.2s ease-out forwards}
@keyframes load{from{transform:scaleX(.05)}to{transform:scaleX(.85)}}
@media (max-width:640px){
  body.racing .logo{display:none}
  .hud{gap:9px;font-size:14px}
  .tools .lbl{display:none}
  .temp .tl,.roomtag .rl{display:none}
  .temp,.roomtag{padding:5px 7px}
  .chip{min-width:88px}
}

/* ---------- Game layout ---------- */
.game{max-width:1240px;margin:0 auto;padding:20px 16px 110px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:1000px){
  .game{grid-template-columns:minmax(0,1fr) 320px;padding-bottom:60px}
  .side{display:flex!important;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
  .bottombar,.sheet,.scrim{display:none!important}
  .chip{max-width:440px;cursor:default}
  .side .tgt .heroimg{height:110px}
  .side .tgt .ext.clamp{-webkit-line-clamp:4}
}
.side{display:none;flex-direction:column;gap:12px}
body.loading #page{opacity:.45;pointer-events:none;transition:opacity .2s}

/* Target card + side blocks */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.tgt .heroimg{height:150px;overflow:hidden;background:var(--chip);position:relative}
.tgt .heroimg img{display:block;width:100%;height:100%;object-fit:cover}
.tgt .heroimg img.blur{filter:blur(14px) saturate(1.2);transform:scale(1.15)}
.tgt .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.tgt .tgt-eb{color:var(--accent)}
.tgt h3{font:700 24px/1.15 var(--display);margin:0;text-wrap:balance}
.tgt.mystery h3{letter-spacing:.02em}
.tgt .desc{font-style:italic;color:var(--muted);margin:0;font-size:15px}
.tgt .ext{margin:0;font-size:15px;line-height:1.55}
.tgt .ext.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.more{align-self:flex-start;padding:0;min-height:0;border:0;background:none;color:var(--accent);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{font:13px var(--sans);background:var(--chip);border-radius:5px;padding:2px 7px;color:var(--ink)}
.tgt .src{font:12px var(--mono);color:var(--muted)}
.tgt .src a{color:var(--muted)}
.pblock{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pblock + .pblock{border-top:1px solid var(--line)}
.pblock h4{margin:0;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.pblock .acts{display:flex;gap:8px;flex-wrap:wrap}
.pblock .acts button{flex:1 1 auto}
.pathlist{margin:0;padding-left:24px;font-size:15px;line-height:1.45}
.pathlist li{padding:2px 0}
.pathlist li::marker{font:12px var(--mono);color:var(--muted)}
.pathlist li:last-child{font-weight:600}
.pathlist li.tp::after{content:" 🌀";font-size:12px}
.twistline{display:flex;flex-wrap:wrap;gap:6px}
.thermo{display:flex;flex-direction:column;gap:6px}
.thermo .bar5{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.thermo .bar5 span{height:8px;border-radius:4px;background:var(--chip)}
.thermo .bar5 span.on.l0{background:var(--cold)} .thermo .bar5 span.on.l1{background:var(--warm)}
.thermo .bar5 span.on.l2{background:var(--hot)} .thermo .bar5 span.on.l3{background:var(--burn)}
.thermo p{margin:0;font-size:15px}

/* Phone bottom bar + sheet */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.bottombar button{flex:1;min-width:0;padding:9px 6px}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;
  background:var(--panel);transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .grab{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 0 16px;position:sticky;top:0;background:var(--panel);z-index:1}
.sheet .panel{border:0;box-shadow:none;border-radius:0}
.sheet .tgt .heroimg{height:110px}
.sheet .sidebox{display:flex;flex-direction:column}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none;visibility:visible;transition:transform .25s ease}

/* Find bar */
.findbar{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top,0px));width:min(520px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:flex;gap:6px;align-items:center}
.findbar input{flex:1;min-width:0}
.findbar span{font:12px var(--mono);color:var(--muted);white-space:nowrap}
@media (max-width:999px){.findbar{top:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px))}}

/* Article title row */
.atitle{font:700 clamp(28px,5vw,40px)/1.12 var(--display);margin:0 0 4px;text-wrap:balance}
.asub{font:13px var(--mono);color:var(--muted);margin:0 0 14px}
.asub .hitnote{color:var(--good)}
.attrib{font:12px var(--mono);color:var(--muted);margin:12px 4px 0}
.attrib a{color:var(--muted)}

/* ---------- Wikipedia content on paper ---------- */
.paper{background:var(--a-bg);color:var(--a-ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:6px 28px 28px;overflow-wrap:break-word;font:16px/1.6 var(--sans);overflow:hidden;color-scheme:light}
@media (max-width:640px){.paper{padding:2px 14px 20px;border-radius:10px;font-size:16px}}
.paper .mw-parser-output{display:flow-root}
.paper h2,.paper h3,.paper h4,.paper h5{color:var(--a-ink);line-height:1.25;margin:1.3em 0 .35em;clear:none}
.paper h2{font:700 26px/1.25 var(--display);border-bottom:1px solid var(--a-line);padding-bottom:3px}
.paper h3{font:700 20px var(--display)}
.paper h4,.paper h5{font:700 16px var(--sans)}
.paper p{margin:.5em 0 .8em}
.paper ul,.paper ol{padding-left:1.6em;margin:.3em 0 .8em}
.paper dl{margin:.3em 0 .8em}.paper dd{margin-left:1.6em}
.paper blockquote{margin:1em 0;padding:0 1.2em;border-left:3px solid var(--a-line)}
.paper pre,.paper code{font:13px var(--mono);background:var(--a-tint);border-radius:3px}
.paper pre{padding:10px;overflow-x:auto}
.paper a.ok{color:var(--a-link);text-decoration:none;cursor:pointer}
.paper a.ok:hover{text-decoration:underline}
.paper a.ok.hit{color:#fff;background:#1f7a4d;border-radius:3px;padding:0 4px;font-weight:600;box-shadow:0 0 0 2px rgba(31,122,77,.25)}
.paper a.ok.oracle{background:#fff3c4;box-shadow:0 0 0 3px #f2c94c;border-radius:3px}
.paper a.ok.fmatch{background:#fff1a8;border-radius:2px}
.paper a.ok.fcur{background:#ffd34d;box-shadow:0 0 0 2px #e0a800;border-radius:2px}
.paper .dead{color:inherit}
.paper .blocked{color:#9aa0a6;text-decoration:line-through;cursor:not-allowed}
.paper.invisible a.ok,.paper.invisible a.ok:hover{color:inherit;text-decoration:none;cursor:text}
.paper.invisible a.ok.hit{background:none;color:inherit;padding:0;font-weight:inherit;box-shadow:none}
.paper .hatnote{font-style:italic;color:var(--a-muted);font-size:14px;padding-left:1.6em;margin:.3em 0}
.paper img{max-width:100%;height:auto;vertical-align:middle}
.paper sup.reference,.paper .reference,.paper .mw-editsection,.paper .mw-cite-backlink,.paper .noprint.mw-collapsible-toggle,
.paper .mw-collapsible-toggle:not(.wr-toggle),.paper .mwe-math-mathml-a11y,.paper .geo-nondefault,.paper .geo-multi-punct,
.paper .wr-hidden,.paper .mw-empty-elt,.paper .error,.paper .Inline-Template{display:none}
.paper .mwe-math-element{display:inline-block;max-width:100%;overflow-x:auto;vertical-align:middle}
.paper .mwe-math-fallback-image-display{display:block;margin:.5em auto}

/* tables */
.paper .tablewrap{overflow-x:auto;margin:1em 0;max-width:100%;-webkit-overflow-scrolling:touch}
.paper .tablewrap>table{margin:0}
.paper .tablewrap>table>caption{text-align:left;padding-left:0}
.paper table{border-collapse:collapse;font-size:14px;line-height:1.4;max-width:none}
.paper table.wikitable,.paper table.wr-grid{background:var(--a-tint);border:1px solid var(--a-line)}
.paper .wikitable>*>tr>th,.paper .wikitable>*>tr>td,.paper .wikitable>tr>th,.paper .wikitable>tr>td{border:1px solid var(--a-line);padding:5px 8px}
.paper .wikitable>*>tr>th,.paper .wikitable>tr>th{background:var(--a-head);text-align:center}
.paper table caption{font-weight:700;padding:6px;text-align:center}
.paper td,.paper th{vertical-align:top}

/* infobox */
.paper .infobox,.paper table.infobox{float:right;clear:right;width:300px;max-width:300px;margin:.5em 0 1em 1.4em;background:var(--a-tint);
  border:1px solid var(--a-line);border-collapse:collapse;font-size:13.5px;line-height:1.4;padding:3px}
.paper .infobox th,.paper .infobox td{padding:3px 6px;vertical-align:top;text-align:left}
.paper .infobox-above,.paper .infobox caption,.paper .infobox .fn{font:700 17px/1.3 var(--sans);text-align:center}
.paper .infobox-header,.paper .infobox-subheader{text-align:center;background:var(--a-head)}
.paper .infobox-image,.paper .infobox-caption{text-align:center}
.paper .infobox-caption{font-size:12.5px;color:var(--a-muted)}
.paper .infobox-label{white-space:normal;padding-right:.6em}
.paper .infobox .wr-toggle{margin-left:.5em}
@media (max-width:720px){
  .paper .infobox,.paper table.infobox{float:none;width:100%;max-width:100%;margin:1em 0;display:table}
}

/* images & figures */
.paper figure,.paper .thumb{margin:.6em 0 1em;display:table;max-width:100%}
.paper figure[typeof~="mw:File/Thumb"],.paper figure[typeof~="mw:File/Frame"],.paper .thumbinner{border:1px solid var(--a-line);background:var(--a-tint);padding:4px;border-radius:2px}
.paper figure.mw-halign-right,.paper .tright,.paper figure[typeof~="mw:File/Thumb"]:not(.mw-halign-left):not(.mw-halign-center):not(.mw-halign-none){float:right;clear:right;margin:.4em 0 1em 1.4em}
.paper figure.mw-halign-left,.paper .tleft{float:left;clear:left;margin:.4em 1.4em 1em 0}
.paper figure.mw-halign-center,.paper .center{margin-left:auto;margin-right:auto}
.paper figcaption,.paper .thumbcaption{display:table-caption;caption-side:bottom;font-size:13px;line-height:1.4;color:var(--a-muted);padding:4px 4px 2px;background:var(--a-tint);border:1px solid var(--a-line);border-top:0}
.paper figure:not([typeof~="mw:File/Thumb"]) figcaption{display:none}
.paper .thumbinner{max-width:100%}
.paper .magnify{display:none}
@media (max-width:640px){
  .paper figure,.paper .thumb,.paper .tright,.paper .tleft{float:none!important;margin:1em auto!important}
  .paper .thumbinner{width:auto!important}
}
.paper ul.gallery,.paper .gallery{display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none;margin:1em 0}
.paper .gallerybox{width:auto!important;max-width:200px;font-size:13px;color:var(--a-muted)}
.paper .gallerybox .thumb{width:auto!important;border:0;padding:0;margin:0;float:none}
.paper .gallerybox div{width:auto!important;margin:0!important;height:auto!important}
.paper .gallerytext{padding:2px 0}
.paper .multiimageinner,.paper .tmulti .trow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.paper .tmulti .thumbinner{display:flex;flex-direction:column;gap:4px}

/* lists */
.paper .hlist ul,.paper .hlist ol,.paper .hlist dl{display:inline;margin:0;padding:0}
.paper .hlist li,.paper .hlist dd,.paper .hlist dt{display:inline;margin:0}
.paper .hlist li:not(:last-child)::after,.paper .hlist dd:not(:last-child)::after{content:" · ";font-weight:700}
.paper .plainlist ul,.paper ul.plainlist{list-style:none;margin:0;padding:0}
.paper .div-col{column-width:22em;column-gap:2em;margin:.3em 0 .8em}
.paper .div-col li{break-inside:avoid}
.paper .refbegin{font-size:14px}

/* show / hide boxes */
.paper .wr-toggle{float:right;font:600 12px var(--sans);color:var(--a-link);background:transparent;border:1px solid var(--a-line);
  border-radius:4px;padding:1px 8px;min-height:0;margin-left:.6em;cursor:pointer}
.paper .wr-toggle:hover{background:var(--a-head);border-color:var(--a-link)}
.paper table.wr-collapsed>tbody>tr:not(.wr-keep),.paper table.wr-collapsed>tr:not(.wr-keep){display:none}
.paper .wr-collapsed>.mw-collapsible-content,.paper .NavFrame.wr-collapsed>.NavContent{display:none}
.paper .NavFrame{border:1px solid var(--a-line);margin:.6em 0;padding:4px 6px;font-size:14px}
.paper .NavHead{font-weight:700;background:var(--a-head);padding:3px 6px;text-align:center}
.paper details{border:1px solid var(--a-line);border-radius:4px;padding:4px 8px;margin:.6em 0}
.paper details>summary{cursor:pointer;font-weight:600}

/* navboxes (only when enabled) */
.paper .navbox{border:1px solid var(--a-line);font-size:13px;margin:1em 0;width:100%;clear:both}
.paper .navbox table{width:100%}
.paper .navbox-title,.paper .navbox-group,.paper .navbox th{background:var(--a-head);padding:3px 8px;text-align:center}
.paper .navbox-group{text-align:right;white-space:nowrap}
.paper .navbox-list{padding:3px 8px;text-align:left}
.paper .navbox-even{background:var(--a-tint)}
.paper .navbox-abovebelow{text-align:center;background:var(--a-tint)}
@media (max-width:640px){.paper .navbox-group{white-space:normal}}

/* chaos */
body.cx-mirror .paper{transform:scaleX(-1)}
body.cx-upside .paper{transform:rotate(180deg)}
body.cx-comic .paper,body.cx-comic .paper *{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive!important}
body.cx-tiny .paper{font-size:10px}

body.cx-blackout .paper a.ok{color:inherit!important;background:none!important;text-decoration:none!important;cursor:text}
body.cx-quake .paper{animation:quake .18s linear infinite}
body.cx-disco .paper{animation:disco 2s linear infinite}
@keyframes quake{0%{transform:translate(0,0)}25%{transform:translate(3px,-2px) rotate(.3deg)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,3px) rotate(-.3deg)}100%{transform:translate(0,0)}}
@keyframes disco{from{filter:hue-rotate(0)}to{filter:hue-rotate(360deg)}}

/* ---------- Home ---------- */
.home{max-width:1120px;margin:0 auto;padding:24px 16px 72px;display:grid;gap:34px}
.home>*{min-width:0}
.hero h1{font:700 clamp(32px,6vw,56px)/1.03 var(--display);margin:4px 0 8px;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .quip{margin:0 0 14px;color:var(--muted);font-style:italic;max-width:60ch}
.match{display:grid;grid-template-columns:minmax(0,.8fr) auto minmax(0,1.2fr);grid-template-areas:"start arrow target" "acts arrow target";grid-template-rows:auto 1fr;gap:14px 18px;align-items:start;margin-top:10px}
.match>.scard{grid-area:start}.match>.arrow{grid-area:arrow}.match>.panel{grid-area:target}.match>.hero-acts{grid-area:acts;margin-top:4px}
.arrow{align-self:center;font:700 30px var(--display);color:var(--muted)}
.match .panel{border-color:var(--accent);border-width:2px}
@media (max-width:760px){.match{grid-template-columns:minmax(0,1fr);grid-template-areas:"start" "arrow" "target" "acts";grid-template-rows:none}.arrow{justify-self:center;transform:rotate(90deg);line-height:1}}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);min-width:0}
.scard img,.scard .noimg{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--chip)}
.scard h3{font:700 22px/1.15 var(--display);margin:2px 0}
.scard p{margin:0;font-size:14px;color:var(--muted);font-style:italic}
.scard>div{min-width:0}
.hero-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.hero-acts button.go{font-size:16px;min-height:50px;padding:0 30px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:12px var(--mono);background:var(--chip);border:0;border-radius:999px;padding:5px 10px;color:var(--ink);min-height:0;white-space:nowrap}
.pill.ok{color:var(--good);font-weight:600}
button.pill:hover{outline:1px solid var(--line)}
.skel{background:linear-gradient(90deg,var(--chip),var(--panel),var(--chip));background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:12px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.skel.h1{height:56px;max-width:640px;margin:6px 0 14px}
.skel.card{height:180px}
.loadline{font:13px var(--mono);color:var(--muted);margin:10px 0 0}
.hero-err{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;gap:12px;align-items:center}
.card-h .em{font-size:30px}
.card h2{font:700 22px/1.2 var(--display);margin:0}
.card p{margin:0}
.dpair{font-size:18px;line-height:1.35}
.joinrow input{flex:1 1 120px;min-width:0;text-transform:uppercase;letter-spacing:.12em;font-family:var(--mono)}

.sec h2.sec-t{font:700 28px/1.15 var(--display);margin:0 0 4px}
.sec .sec-sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border-radius:999px;white-space:nowrap;flex:none}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.catrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;margin-bottom:10px}
.catrow .eyebrow{padding-top:10px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{--h:200;background:hsl(var(--h) var(--cat-s) var(--cat-l));color:hsl(var(--h) 45% var(--cat-ink-l));border:2px solid transparent;
  border-radius:999px;padding:5px 12px;font:600 14px var(--sans);min-height:36px}
.cat:hover{border-color:hsl(var(--h) 40% var(--cat-ink-l) / .35)}
.cat[aria-pressed="true"]{border-color:hsl(var(--h) 55% var(--cat-ink-l));box-shadow:0 1px 0 hsl(var(--h) 40% var(--cat-ink-l) / .3)}
.cat[aria-pressed="true"]::before{content:"✓ "}
.mycats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mycat{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 2px 2px 12px;font:14px var(--sans)}
.mycat button{min-height:30px;padding:2px 8px;border:0;background:none}
.nice{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.subrow{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.combo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.combo{text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;font:inherit;min-height:0;background:var(--panel);position:relative}
.combo b{font:700 17px/1.25 var(--display);color:var(--ink)}
.combo small{color:var(--muted);font:13px/1.4 var(--sans)}
.combo.sel{border:2px solid var(--accent);padding:13px}
.combo .done{position:absolute;top:10px;right:12px;font:600 11px var(--mono);color:var(--good)}
.wordsform{display:flex;flex-wrap:wrap;gap:8px}
.wordsform input{flex:1 1 180px;min-width:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.mode{text-align:left;padding:14px;border-radius:12px;font:inherit;display:flex;flex-direction:column;gap:4px;background:var(--panel);min-height:0}
.mode b{font:700 18px var(--display);color:var(--ink)}
.mode small{font:14px/1.4 var(--sans);color:var(--muted)}
.mode[aria-pressed="true"]{border:2px solid var(--accent);padding:13px}
.timerow{margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;min-height:36px;padding:6px 14px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.twists{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.twist{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border-radius:12px;font:inherit;background:var(--panel);min-height:0}
.twist .em{font-size:24px;padding-top:2px}
.twist b{display:block;font:700 16px var(--display);color:var(--ink)}
.twist small{display:block;font:13.5px/1.4 var(--sans);color:var(--muted)}
.twist .sw{margin-left:auto;flex:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;margin-top:3px}
.twist .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .2s}
.twist[aria-pressed="true"]{border-color:var(--ink);background:var(--chip)}
.twist[aria-pressed="true"] .sw{background:var(--accent)}
.twist[aria-pressed="true"] .sw::after{transform:translateX(14px)}
label.check{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink);cursor:pointer;margin:6px 0}
label.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.foot{color:var(--muted);font-size:15px;border-top:1px solid var(--line);padding-top:18px}
.foot summary{cursor:pointer;color:var(--ink);font-weight:600}
.foot ul{padding-left:1.2em}
.msg{padding:56px 16px;color:var(--muted);text-align:center;font-style:italic}

/* ---------- Results ---------- */
.result{max-width:820px;margin:20px auto 60px;padding:0 16px;display:flex;flex-direction:column;gap:18px}
.res-top{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:26px 20px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px}
.result.won .res-top{border-color:var(--good)}
.res-emoji{font-size:54px;line-height:1.1}
.res-top h2{font:700 clamp(28px,6vw,42px)/1.1 var(--display);margin:0;text-wrap:balance}
.result.won .res-top h2{color:var(--good)}
.res-top .rank{font:600 15px var(--mono);margin:6px 0 0;color:var(--accent)}
.res-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.res-stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;display:flex;flex-direction:column}
.res-stats b{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.res-stats small{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.res-line{margin:0;text-align:center;color:var(--muted)}
.fact{display:flex;gap:12px;align-items:flex-start;background:var(--chip);border-radius:12px;padding:14px 16px}
.fact p{margin:0}
.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.versus .vs{font:700 18px var(--display);color:var(--muted)}
.versus div{text-align:center}
.versus b{display:block;font:600 20px var(--mono)}
.versus .win{color:var(--good)}
.route-wrap{display:flex;flex-direction:column;gap:8px}
.route{list-style:none;margin:0;padding:4px 2px 10px;display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x proximity}
.route li{flex:none;width:120px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;position:relative}
.route li:not(:last-child)::after{content:"→";position:absolute;right:-18px;top:28px;color:var(--muted);font:700 16px var(--display)}
.route .th{width:120px;height:76px;border-radius:10px;background:var(--chip);background-size:cover;background-position:center;display:grid;place-items:center;font:700 26px var(--display);color:var(--muted);border:1px solid var(--line)}
.route .th img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}
.route .st{font:13px/1.3 var(--sans);width:120px;overflow-wrap:break-word}
.route .no{font:11px var(--mono);color:var(--muted)}
.route li.end .th{border:2px solid var(--good)}
.par{margin:0;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.res-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.res-acts .go{min-height:46px;padding:0 22px;font-size:15px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.badge{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.badge .em{font-size:26px}
.badge b{display:block;font:600 14px var(--sans)}
.badge small{display:block;font:12.5px/1.35 var(--sans);color:var(--muted)}
.badge.locked{opacity:.5;filter:grayscale(1)}
.badge.new{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

/* ---------- Modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.42);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px 24px;overflow:auto}
.modal{background:var(--panel);color:var(--ink);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);position:relative;padding:22px 20px 20px;margin:auto 0}

.modal .x{position:absolute;top:10px;right:10px;border:0;background:none;font-size:18px;min-height:36px}
.modal h2{font:700 26px/1.15 var(--display);margin:0 0 6px;padding-right:36px}
.modal h3{font:700 18px var(--display);margin:18px 0 8px}
.modal .lead{color:var(--muted);margin:0 0 14px;font-size:15px}
label.field{display:flex;flex-direction:column;gap:5px;font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
label.field input,label.field select,label.field textarea{text-transform:none;letter-spacing:0;color:var(--ink)}
.modal .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.avatars{display:flex;flex-wrap:wrap;gap:6px}
.avatars button{font-size:22px;min-height:44px;width:46px;padding:0}
.avatars button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--chip)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.tile{background:var(--chip);border-radius:12px;padding:12px;text-align:center;display:flex;flex-direction:column}
.tile b{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.tile small{font:11px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--chip);border-radius:10px;padding:8px 10px;font-size:14px}
.hist .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .r{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.sugg button{min-height:32px;padding:4px 10px;font:13px var(--sans)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kbd kbd{font:12px var(--mono);background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

/* ---------- Toast, link preview, countdown, reactions ---------- */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--panel);
  font:14px/1.4 var(--sans);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:min(520px,calc(100% - 32px));text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.lp{position:fixed;z-index:35;width:320px;max-width:calc(100% - 16px);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);overflow:hidden;pointer-events:none}

.cdown{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(17,21,19,.72)}
.cdown span{font:700 clamp(90px,22vw,200px)/1 var(--display);color:#fff;animation:cd .9s ease-out}
@keyframes cd{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
.rxlayer{position:fixed;right:18px;bottom:96px;width:0;height:0;z-index:55;pointer-events:none}
.rx{position:absolute;right:0;bottom:0;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;box-shadow:var(--shadow);white-space:nowrap;animation:rise 2.8s ease-out forwards;font:13px var(--sans)}
.rx .e{font-size:28px}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}12%{transform:translateY(-20px) scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-220px);opacity:0}}
.rxbar{display:flex;flex-wrap:wrap;gap:6px}
.rxbar button{font-size:20px;min-height:40px;width:44px;padding:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}

/* ---------- Rooms ---------- */
.room{max-width:1120px;margin:0 auto;padding:24px 16px 72px;display:grid;gap:20px}
.room-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.room-head h1{font:700 clamp(30px,6vw,46px)/1.05 var(--display);margin:0}
.code{font-family:var(--mono);letter-spacing:.14em;background:var(--chip);border-radius:10px;padding:2px 12px}

.invite a:hover{border-color:var(--ink)}
.qr{background:#fff;border-radius:12px;padding:8px;width:180px;height:180px}
.qr svg{width:100%;height:100%}
.room-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
@media (max-width:860px){.room-grid{grid-template-columns:minmax(0,1fr)}}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--chip);border-radius:10px;padding:8px 10px}
.plist .av{font-size:24px;line-height:1}
.plist .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .nm small{display:block;font:12px var(--mono);color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.plist .sc{font:600 13px var(--mono);white-space:nowrap}
.plist li.me{outline:2px solid var(--accent);outline-offset:-2px}
.plist li.gone{opacity:.5}
.setupgrid{display:grid;gap:12px}
.setupgrid label:not(.check){display:flex;flex-direction:column;gap:4px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.setupgrid select{text-transform:none;letter-spacing:0;color:var(--ink);width:100%}
.mini-twists{display:flex;flex-wrap:wrap;gap:6px}
.mini-twists button{min-height:34px;padding:5px 10px;border-radius:999px;font:13px var(--sans)}
.mini-twists button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.preview{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.preview .scard{padding:10px 12px}
.preview .scard img,.preview .scard .noimg{width:48px;height:48px}
.preview .scard h3{font-size:18px}

.waiting{display:flex;align-items:center;gap:10px;color:var(--muted);font-style:italic}
.dots::after{content:"…";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;max-width:560px;margin:0 auto;width:100%}
.podium div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.podium .av{font-size:40px;line-height:1}
.podium .nm{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .blk{width:100%;border-radius:10px 10px 0 0;background:var(--chip);display:grid;place-items:center;font:700 26px var(--display)}

.podium .p3 .blk{height:56px}
.rtable{width:100%;border-collapse:collapse;font-size:15px}
.rtable th,.rtable td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rtable th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rtable td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rtable details summary{cursor:pointer;color:var(--muted);font-size:13px}
.rtable .pathtxt{font-size:13px;color:var(--muted)}
.connstate{font:12px var(--mono);color:var(--muted)}
.connstate.bad{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

<body>
<header>
  <div class="bar">

function fmtTime(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`;
}
function hashStr(s){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// Small seeded random generator (mulberry32), so the daily race is the same for everyone.
function rngFrom(seed){
  let a = (typeof seed === 'number' ? seed : hashStr(String(seed))) >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rnd = Math.random){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

}

function b64urlEncode(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(s){
  try{
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  }catch{ return null; }
}

async function copyText(text, btn){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }
  catch{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.append(ta); ta.select();
    try{ ok = document.execCommand('copy'); }catch{}
    ta.remove();
  }
  flash(btn, ok ? 'Copied ✓' : 'Copy failed');
  if (!ok) toast('Your browser blocked copying. Select the text and copy it by hand.');
  return ok;
}
function flash(btn, text){
  if (!btn) return;
  if (!btn.dataset.label) btn.dataset.label = btn.innerHTML;
  btn.textContent = text;
  clearTimeout(btn._flash);
  btn._flash = setTimeout(() => { btn.innerHTML = btn.dataset.label; delete btn.dataset.label; }, 1600);
}
async function shareOrCopy(text, btn){
  if (navigator.share && matchMedia('(pointer: coarse)').matches){
    try{ await navigator.share({text}); return; }
    catch(e){ if (e && e.name === 'AbortError') return; }
  }
  copyText(text, btn);
}

/* ---------- Toasts (queued, so achievements don't overwrite each other) ---------- */
const TOASTS = [];
let toastBusy = false;
function toast(msg, ms = 3000){
  if (TOASTS.length > 4) TOASTS.shift();
  TOASTS.push({msg, ms});
  if (!toastBusy) nextToast();
}
function nextToast(){
  const t = $('toast'), item = TOASTS.shift();
  if (!item){ toastBusy = false; return; }
  toastBusy = true;
  t.textContent = item.msg; t.classList.add('show');
  setTimeout(() => { t.classList.remove('show'); setTimeout(nextToast, 220); }, item.ms);
}

let MODAL_CLOSE = null;
function openModal(html, {wide = false, onClose = null, focus = true} = {}){

  setTimeout(() => {
    const active = document.activeElement;
    if (active && active !== document.body && $('modal').contains(active) && active.matches('input,select,textarea')) return;   // the player is already typing somewhere
    const f = $('modal').querySelector('[autofocus]') || $('modal').querySelector('input,select,textarea');
    if (f) f.focus();

}
function closeModal(){
  if ($('modal').hidden) return;
  $('modal').hidden = true;
  $('modalBody').innerHTML = '';
  document.body.classList.remove('modal-open');
  const f = MODAL_CLOSE; MODAL_CLOSE = null;

}

const LIB_PROMISES = {};
function loadScript(src, globalName){
  return new Promise((resolve, reject) => {
    if (window[globalName]) return resolve(window[globalName]);
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => window[globalName] ? resolve(window[globalName]) : reject(new Error('Library did not load'));
    s.onerror = () => { s.remove(); reject(new Error('Could not load ' + src)); };
    document.head.append(s);
  });
}
function loadLib(name){
  if (!LIB_PROMISES[name]){
    const lib = LIBS[name];
    LIB_PROMISES[name] = (async () => {
      for (const u of lib.urls){ try{ return await loadScript(u, lib.global); }catch{} }
      delete LIB_PROMISES[name];
      throw new Error('A needed library could not be downloaded. Check your connection.');
    })();
  }
  return LIB_PROMISES[name];
}

/* ---------- Confetti ---------- */
function confetti(){
  if (reduceMotion()) return;
  const cv = $('fx'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.hidden = false; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const colors = ['#f08a4b', '#1f7a4d', '#2a5db0', '#f2c94c', '#c0182b', '#7b61ff'];
  const parts = Array.from({length: 160}, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4, s: 5 + Math.random() * 6,
    r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: pick(colors)
  }));
  const t0 = performance.now();
  (function frame(t){
    const el = t - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, 1 - el / 2600);
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (el < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  })(t0);
}
