/* =====================================================================
   Multiplayer rooms
   Messages travel through free public MQTT brokers over WebSocket.
   Topics: wikirace/v3/CODE/room (retained room state, written by the host)
           wikirace/v3/CODE/p/ID  (retained presence, cleared by the broker when a player drops)
           wikirace/v3/CODE/ev    (live events: progress, finish, reactions)
   ===================================================================== */
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
const ROOM_ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ';
const ROOM_TTL = 3 * 3600e3;
const COUNTDOWN_MS = 3600;

function parseJSON(buf){
  try{
    const s = typeof buf === 'string' ? buf : new TextDecoder().decode(buf);
    if (!s || s.length > 30000) return null;
    return JSON.parse(s);
  }catch{ return null; }
}
const strIn = (x, n) => typeof x === 'string' ? x.slice(0, n) : '';
function cleanResult(r){
  return {c: Math.max(0, Math.min(9999, Math.floor(+r.c || 0))), ms: Math.max(0, Math.floor(+r.ms || 0)), won: !!r.won,
    why: ['time', 'clicks', 'gaveup', 'ended', 'left', ''].includes(r.why) ? r.why : '',
    path: (Array.isArray(r.path) ? r.path : []).slice(0, 60).map(x => String(x).slice(0, 200))};
}
function cleanPlayer(d){
  return {id: d.id, name: (typeof d.name === 'string' && d.name.trim() ? d.name.trim() : 'Player').slice(0, 24), avatar: AVATARS.includes(d.avatar) ? d.avatar : '🙂', joined: +d.joined || 0};
}
function cleanCard(x){
  if (!x || typeof x !== 'object' || !strIn(x.title, 250)) return null;
  return {title: strIn(x.title, 250), desc: strIn(x.desc, 300), extract: strIn(x.extract, 900), img: /^https:\/\/upload\.wikimedia\.org\//.test(x.img || '') ? strIn(x.img, 600) : ''};
}
function cleanRoom(d){
  if (!d || typeof d !== 'object' || d.v !== 3 || !validId(d.host)) return null;
  const ci = d.cfg && typeof d.cfg === 'object' ? d.cfg : {};
  const cfg = {lang: LANGS.some(l => l.code === ci.lang) ? ci.lang : 'en', mode: MODES[ci.mode] ? ci.mode : 'classic',
    timeLimit: TIME_LIMITS.includes(+ci.timeLimit) ? +ci.timeLimit : 150, twists: (Array.isArray(ci.twists) ? ci.twists : []).filter(t => TWISTS[t]),
    navboxes: !!ci.navboxes, spy: !!ci.spy};
  let pair = null;
  if (d.pair && cleanCard(d.pair.start) && cleanCard(d.pair.target)) pair = {start: cleanCard(d.pair.start), target: cleanCard(d.pair.target), fact: strIn(d.pair.fact, 400), label: strIn(d.pair.label, 200), combo: strIn(d.pair.combo, 40)};
  const results = {}, scores = {};
  for (const [id, r] of Object.entries(d.results || {})) if (validId(id) && r && typeof r === 'object') results[id] = cleanResult(r);
  for (const [id, s] of Object.entries(d.scores || {})) if (validId(id) && s && typeof s === 'object') scores[id] = {name: strIn(s.name, 24) || 'Player', avatar: AVATARS.includes(s.avatar) ? s.avatar : '🙂', pts: Math.max(0, Math.floor(+s.pts || 0)), wins: Math.max(0, Math.floor(+s.wins || 0))};
  const si = d.src && typeof d.src === 'object' ? d.src : {};
  return {v: 3, rev: Math.max(0, Math.floor(+d.rev || 0)), code: strIn(d.code, 5), host: d.host, created: +d.created || 0, updated: +d.updated || 0,
    status: ['lobby', 'countdown', 'racing', 'results'].includes(d.status) ? d.status : 'lobby', round: Math.max(0, Math.floor(+d.round || 0)),
    cfg, pair, results, scores,
    src: {kind: ['random', 'cats', 'trivia', 'silly'].includes(si.kind) ? si.kind : 'random', from: strIn(si.from, 40) || 'food', to: strIn(si.to, 40) || 'space', combo: strIn(si.combo, 40) || null},
    racers: (Array.isArray(d.racers) ? d.racers : []).filter(validId).slice(0, 30),
    ranking: (Array.isArray(d.ranking) ? d.ranking : []).filter(validId).slice(0, 30)};
}
const cardData = s => ({title: s.title, desc: s.desc || '', img: s.img || '', extract: (s.extract || '').slice(0, 600)});
function whyText(res){
  if (!res) return 'still racing';
  return {time: 'out of time', clicks: 'out of clicks', gaveup: 'gave up', left: 'left', ended: 'did not finish'}[res.why] || 'did not finish';
}
function roomPills(cfg){
  const m = MODES[cfg.mode];
  return [`<span class="pill">${m.e} ${esc(m.n)}${cfg.mode === 'time' ? ' ' + fmtTime(cfg.timeLimit * 1000) : ''}</span>`,
    ...cfg.twists.map(t => `<span class="pill">${TWISTS[t].e} ${esc(TWISTS[t].n)}</span>`),
    cfg.spy ? '<span class="pill">👀 Pages visible</span>' : '', cfg.navboxes ? '<span class="pill">🧭 Navigation boxes</span>' : ''].join('');
}
function countdown(){
  return new Promise(res => {
    const el = $('cdown');
    el.hidden = false;
    let k = 3;
    const step = () => {
      if (k > 0){ el.innerHTML = `<span>${k}</span>`; SND.tick(); k--; setTimeout(step, 900); }
      else { el.innerHTML = '<span>Go!</span>'; SND.go(); setTimeout(() => { el.hidden = true; el.innerHTML = ''; res(); }, 550); }
    };
    step();
  });
}

const MP = {
  client: null, url: '', bidx: 0, code: '', room: null, me: null, override: null,
  players: new Map(), prog: new Map(), fins: new Map(),
  startedRound: 0, champRound: 0, migrateTimer: null, hbTimer: null, lastEmo: 0, conn: 'off', busy: false, view: '',

  brokers(){ const c = String(this.override || SET.broker || '').trim(); return c ? [c] : BROKERS; },
  custom(){ return String(this.override || SET.broker || '').trim(); },
  get base(){ return `wikirace/v3/${this.code}`; },
  topic(sub){ return `${this.base}/${sub}`; },
  isHost(){ return !!(this.room && this.me && this.room.host === this.me.id); },
  active(){ return !!(this.client && this.room); },
  inviteParams(){ const p = {room: this.code}; if (this.custom()) p.broker = this.custom(); else if (this.bidx) p.b = this.bidx; return p; },
  inviteUrl(){ return baseUrl() + '?' + new URLSearchParams(this.inviteParams()).toString(); },
  ident(){
    let id = sess.get('pid');
    if (!validId(id)){ id = (Math.random().toString(36).slice(2, 10) + 'x0x0x0x0').slice(0, 8); sess.set('pid', id); }
    return {id, name: (SET.name || 'Player').slice(0, 24), avatar: SET.avatar, joined: Date.now()};
  },
  reset(){
    clearInterval(this.hbTimer); clearTimeout(this.migrateTimer);
    this.client = null; this.room = null; this.code = ''; this.busy = false; this.conn = 'off';
    this.players = new Map(); this.prog = new Map(); this.fins = new Map(); this.startedRound = 0; this.view = '';
  },

  async connect(url, code){
    const lib = await loadLib('mqtt');
    const connectFn = lib.connect || (lib.default && lib.default.connect);
    this.code = code;
    return new Promise((resolve, reject) => {
      let done = false, c = null;
      const fail = err => { if (done) return; done = true; clearTimeout(t); try{ c && c.end(true); }catch{} reject(err instanceof Error ? err : new Error('Could not connect')); };
      const t = setTimeout(() => fail(new Error('timeout')), 8000);
      try{
        c = connectFn(url, {protocolVersion: 4, clientId: `wr_${this.me.id}_${Math.random().toString(36).slice(2, 6)}`, clean: true, keepalive: 30,
          reconnectPeriod: 0, connectTimeout: 7000, will: {topic: `wikirace/v3/${code}/p/${this.me.id}`, payload: '', retain: true, qos: 1}});
      }catch(e){ fail(e); return; }
      c.once('connect', () => { if (done) return; done = true; clearTimeout(t); c.options.reconnectPeriod = 2500; resolve(c); });
      c.once('error', fail);
      c.once('close', () => fail(new Error('closed')));
    });
  },
  waitRoom(c, ms){
    return new Promise(res => {
      const topic = this.topic('room');
      let over = false;
      const end = v => { if (over) return; over = true; clearTimeout(t); c.removeListener('message', h); res(v); };
      const h = (tp, buf) => { if (tp === topic){ const r = parseJSON(buf); end(r && r.v === 3 ? r : null); } };
      const t = setTimeout(() => end(null), ms);
      c.on('message', h);
      c.subscribe(topic, {qos: 1}, err => { if (err) end(null); });
    });
  },
  async create(){
    if (this.client) this.leave(true);
    this.reset(); this.me = this.ident();
    const list = this.brokers();
    for (let i = 0; i < list.length; i++){
      for (let attempt = 0; attempt < 3; attempt++){
        const code = Array.from({length: 5}, () => ROOM_ALPHA[Math.floor(Math.random() * ROOM_ALPHA.length)]).join('');
        let c;
        try{ c = await this.connect(list[i], code); }catch{ break; }
        const old = await this.waitRoom(c, 1200);
        if (old && Date.now() - (+old.updated || 0) < ROOM_TTL){ try{ c.end(true); }catch{} continue; }
        this.client = c; this.url = list[i]; this.bidx = i;
        this.room = {v: 3, rev: 0, code, host: this.me.id, created: Date.now(), updated: Date.now(), status: 'lobby', round: 0,
          cfg: {lang: SET.lang, mode: SETUP.mode, timeLimit: SETUP.timeLimit, twists: SETUP.twists.slice(), navboxes: SET.navboxes, spy: false},
          src: {kind: 'random', from: SETUP.from, to: SETUP.to, combo: null}, pair: null, racers: [], results: {}, ranking: [], scores: {}};
        this.attach();
        this.publishPresence();
        this.publishRoom();
        return code;
      }
    }
    this.reset();
    throw new Error('Could not reach any multiplayer server. Your network may block them. Try again later, or send a challenge link instead.');
  },
  async join(code, hint){
    if (this.client) this.leave(true);
    this.reset(); this.me = this.ident();
    const list = this.brokers();
    let order = list.map((_, i) => i);
    const h = parseInt(hint, 10);
    if (Number.isInteger(h) && list[h]) order = [h, ...order.filter(i => i !== h)];
    let reached = 0;
    for (const i of order){
      let c;
      try{ c = await this.connect(list[i], code); reached++; }catch{ continue; }
      const raw = await this.waitRoom(c, 2600);
      const r = cleanRoom(raw);
      if (r && Date.now() - r.updated < ROOM_TTL){
        this.client = c; this.url = list[i]; this.bidx = i; this.room = r;
        this.attach(); this.publishPresence();
        return r;
      }
      try{ c.end(true); }catch{}
    }
    this.reset();
    throw new Error(reached ? `Room ${code} was not found. Check the code, or ask for a fresh invite link.` : 'Could not reach any multiplayer server. Your network may block them.');
  },
  attach(){
    const c = this.client;
    c.removeAllListeners('message');
    c.on('message', (tp, buf) => this.onMessage(tp, buf));
    const subs = [this.topic('room'), this.topic('p/+'), this.topic('ev')];
    c.subscribe(subs, {qos: 1});
    c.on('connect', () => { c.subscribe(subs, {qos: 1}); this.publishPresence(); if (this.isHost()) this.publishRoom(); this.setConn('ok'); });
    c.on('offline', () => this.setConn('offline'));
    c.on('reconnect', () => this.setConn('reconnecting'));
    c.on('error', () => {});
    this.setConn('ok');
    clearInterval(this.hbTimer);
    this.hbTimer = setInterval(() => { if (this.isHost() && this.client && this.client.connected) this.publishRoom(); }, 60000);
    sess.set('room', {code: this.code});
    setUrl(this.inviteParams());
  },
  setConn(s){
    const was = this.conn; this.conn = s;
    const el = $('connstate');
    if (el){ el.textContent = this.connText(); el.classList.toggle('bad', s !== 'ok'); }
    if (s === 'offline' && was === 'ok') toast('📡 Connection lost. Reconnecting…');
    if (s === 'ok' && (was === 'offline' || was === 'reconnecting')) toast('📡 Back online.');
  },
  connText(){ return this.conn === 'ok' ? `● Connected${this.custom() ? ' to your server' : ` · server ${this.bidx + 1}`}` : '● Reconnecting…'; },
  publishPresence(){
    if (!this.client || !this.me) return;
    this.me.name = (SET.name || 'Player').slice(0, 24); this.me.avatar = SET.avatar;
    const p = {v: 3, id: this.me.id, name: this.me.name, avatar: this.me.avatar, joined: this.me.joined};
    this.players.set(p.id, cleanPlayer(p));
    this.client.publish(this.topic('p/' + this.me.id), JSON.stringify(p), {qos: 1, retain: true});
  },
  publishRoom(){
    if (!this.client || !this.room) return;
    const r = this.room;
    r.rev = (r.rev || 0) + 1; r.updated = Date.now();
    this.client.publish(this.topic('room'), JSON.stringify(r), {qos: 1, retain: true});
  },
  send(ev){ if (this.client && this.me) this.client.publish(this.topic('ev'), JSON.stringify({...ev, id: this.me.id}), {qos: ev.t === 'fin' ? 1 : 0}); },

  onMessage(tp, buf){
    if (!this.code || !tp.startsWith(this.base + '/')) return;
    const sub = tp.slice(this.base.length + 1);
    const data = buf && buf.length ? parseJSON(buf) : null;
    if (sub === 'room'){
      if (!data){ this.onRoomGone(); return; }
      const r = cleanRoom(data);
      if (!r) return;
      if (this.room && r.rev <= this.room.rev && r.host === this.room.host) return;   // an older copy, or our own echo
      this.room = r;
      this.applyRoom();
      return;
    }
    if (sub.startsWith('p/')){
      const id = sub.slice(2);
      if (!validId(id)) return;
      if (data && data.id === id) this.players.set(id, cleanPlayer(data));
      else if (id !== this.me.id) this.players.delete(id);
      else setTimeout(() => this.publishPresence(), 400);   // the broker cleared our presence after a reconnect: put it back
      this.onPlayers();
      return;
    }
    if (sub === 'ev' && data) this.onEvent(data);
  },
  onRoomGone(){
    if (!this.room || this.isHost()) return;
    toast('🚪 The host closed the room.');
    this.leave(true);
    renderHome();
  },
  onPlayers(){
    const r = this.room; if (!r) return;
    if (!this.players.has(r.host)) this.scheduleMigrate(); else clearTimeout(this.migrateTimer);
    if (this.isHost() && this.checkRoundOver()) return;
    this.render();
  },
  scheduleMigrate(){
    clearTimeout(this.migrateTimer);
    this.migrateTimer = setTimeout(() => {
      const r = this.room;
      if (!r || this.players.has(r.host)) return;
      const alive = [...this.players.values()].sort((a, b) => a.joined - b.joined || (a.id < b.id ? -1 : 1));
      if (alive[0] && alive[0].id === this.me.id){
        r.host = this.me.id;
        this.publishRoom();
        toast('👑 The host left. You are the host now.');
        if (!this.checkRoundOver()) this.render();
      }
    }, 7000);
  },
  applyRoom(){
    const r = this.room; if (!r) return;
    if (!this.players.has(r.host)) this.scheduleMigrate(); else clearTimeout(this.migrateTimer);
    if ((r.status === 'countdown' || r.status === 'racing') && r.round > this.startedRound && r.racers.includes(this.me.id)){
      this.startedRound = r.round;
      this.prog = new Map(); this.fins = new Map();
      this.beginRound(r.status === 'countdown');
      return;
    }
    for (const [id, res] of Object.entries(r.results)) this.fins.set(id, res);
    if (r.status === 'results' && R && R.extra.room && !R.ended && R.extra.round === r.round){ finish('failed', 'ended'); return; }
    if (r.status === 'results' && r.ranking[0] === this.me.id && this.champRound !== r.round){
      this.champRound = r.round;
      if (unlock('champ')) toast('🏆 Achievement unlocked: Champion');
    }
    this.render();
  },
  async beginRound(withCountdown){
    const r = this.room, round = r.round, pd = r.pair, cfg = {...r.cfg, twists: r.cfg.twists.slice()};
    closeModal();
    if (!pd) return;
    const cd = withCountdown ? countdown() : Promise.resolve();
    let pair;
    try{ pair = await makePair({kind: 'fixed', s: pd.start.title, t: pd.target.title}, cfg.lang); }
    catch(e){
      await cd;
      toast('Could not load this race: ' + e.message);
      this.send({t: 'fin', r: round, c: 0, ms: 0, won: false, why: 'gaveup', path: []});
      this.render();
      return;
    }
    pair.fact = pd.fact || ''; pair.label = pd.label || ''; pair.comboId = pd.combo || null;
    await cd;
    if (!this.room || this.room.round !== round || this.room.status === 'results') { this.render(); return; }
    startRace(pair, cfg, {room: this.code, round});
  },
  progress(){
    if (!R || !R.extra.room) return;
    this.send({t: 'prog', r: R.extra.round, c: R.clicks, n: R.path.length - 1, p: R.current || '', ms: Math.round(R.t0 ? performance.now() - R.t0 : 0)});
  },
  finished(g){
    const res = {c: g.clicks, ms: g.ms, won: g.won, why: g.status === 'gaveup' ? 'gaveup' : (g.why || ''), path: g.path.slice(0, 60)};
    this.fins.set(this.me.id, res);
    this.send({t: 'fin', r: g.round, ...res});
    if (this.isHost() && this.room && this.room.round === g.round && (this.room.status === 'racing' || this.room.status === 'countdown')){
      this.room.results[this.me.id] = cleanResult(res);
      if (!this.checkRoundOver()) this.publishRoom();
    }
    this.render();
  },
  onEvent(ev){
    if (!validId(ev.id) || !this.room) return;
    const r = this.room;
    if (ev.t === 'prog' && +ev.r === r.round){
      this.prog.set(ev.id, {c: Math.max(0, Math.floor(+ev.c || 0)), n: Math.max(0, Math.floor(+ev.n || 0)), p: strIn(ev.p, 200), ms: +ev.ms || 0});
      this.refreshBoard();
    } else if (ev.t === 'fin' && +ev.r === r.round){
      const res = cleanResult(ev), had = this.fins.has(ev.id);
      this.fins.set(ev.id, res);
      if (this.isHost() && (r.status === 'racing' || r.status === 'countdown') && r.racers.includes(ev.id) && !r.results[ev.id]){
        r.results[ev.id] = res;
        if (this.checkRoundOver()) return;
        this.publishRoom();
      }
      if (!had && ev.id !== this.me.id){
        const nm = (this.players.get(ev.id) || {}).name || 'Someone';
        toast(res.won ? `🏁 ${nm} reached the target in ${plural(res.c, 'click')}!` : `💨 ${nm} is out of this round.`, 2600);
      }
      this.refreshBoard();
      if (!(R && R.extra.room && !R.ended)) this.render();
    } else if (ev.t === 'emo') this.showEmo(ev);
  },
  checkRoundOver(){
    const r = this.room;
    if (!this.isHost() || !(r.status === 'racing' || r.status === 'countdown')) return false;
    const alive = r.racers.filter(id => this.players.has(id));
    if (alive.length && !alive.every(id => r.results[id])) return false;
    this.endRound();
    return true;
  },
  endRound(){
    const r = this.room;
    if (!this.isHost() || r.status === 'results' || r.status === 'lobby') return;
    r.status = 'results';
    r.racers.forEach(id => { if (!r.results[id]) r.results[id] = {c: (this.prog.get(id) || {}).c || 0, ms: 0, won: false, why: this.players.has(id) ? 'ended' : 'left', path: []}; });
    const winners = Object.entries(r.results).filter(([id, x]) => x.won && r.racers.includes(id))
      .sort((a, b) => r.cfg.mode === 'time' ? a[1].ms - b[1].ms : (a[1].c - b[1].c || a[1].ms - b[1].ms));
    r.ranking = winners.map(([id]) => id);
    r.racers.forEach(id => {
      const p = this.players.get(id) || r.scores[id] || {};
      const sc = r.scores[id] || {name: p.name || 'Player', avatar: p.avatar || '🙂', pts: 0, wins: 0};
      sc.name = p.name || sc.name; sc.avatar = p.avatar || sc.avatar;
      r.scores[id] = sc;
    });
    r.ranking.forEach((id, i) => { r.scores[id].pts += [3, 2, 1][i] || 0; if (i === 0) r.scores[id].wins++; });
    this.publishRoom();
    this.applyRoom();
  },
  startRound(){
    const r = this.room;
    if (!this.isHost() || !r.pair || r.status !== 'lobby' || this.busy) return;
    r.round++; r.status = 'countdown'; r.racers = [...this.players.keys()].filter(validId).slice(0, 30); r.results = {}; r.ranking = [];
    this.prog = new Map(); this.fins = new Map();
    this.publishRoom();
    this.applyRoom();
    const round = r.round;
    setTimeout(() => { if (this.room && this.room.round === round && this.room.status === 'countdown' && this.isHost()){ this.room.status = 'racing'; this.publishRoom(); } }, COUNTDOWN_MS);
  },
  nextRound(){
    const r = this.room;
    if (!this.isHost()) return;
    r.status = 'lobby'; r.results = {}; r.ranking = []; r.racers = []; r.pair = null;
    this.prog = new Map(); this.fins = new Map();
    this.publishRoom();
    this.render();
    this.rollPair();
  },
  roomSource(){
    const s = this.room.src;
    if (s.kind === 'cats') return {kind: 'cats', from: findCat(s.from) ? s.from : 'food', to: findCat(s.to) ? s.to : 'space'};
    if (s.kind === 'trivia' || s.kind === 'silly') return {kind: s.kind, combo: s.combo || null};
    return {kind: 'random'};
  },
  async rollPair(){
    if (!this.isHost() || this.busy) return;
    this.busy = true; this.render();
    const r = this.room;
    try{
      const p = await makePair(this.roomSource(), r.cfg.lang);
      if (this.room === r && r.status === 'lobby'){
        r.pair = {start: cardData(p.start), target: cardData(p.target), fact: p.fact || '', label: p.label || '', combo: p.comboId || ''};
        this.publishRoom();
      }
    }catch(e){ toast(e.message); }
    finally{ this.busy = false; if (this.room) this.render(); }
  },
  setCfg(patch, reroll){
    if (!this.isHost() || this.room.status !== 'lobby') return;
    Object.assign(this.room.cfg, patch);
    if (reroll){ this.room.pair = null; this.publishRoom(); this.rollPair(); }
    else { this.publishRoom(); this.render(); }
  },
  setSrc(patch){
    if (!this.isHost() || this.room.status !== 'lobby') return;
    Object.assign(this.room.src, patch);
    this.publishRoom();
    this.rollPair();
  },
  leave(silent){
    const c = this.client;
    if (c){
      try{
        if (this.isHost()){
          const others = [...this.players.values()].filter(p => p.id !== this.me.id).sort((a, b) => a.joined - b.joined);
          if (others.length){ this.room.host = others[0].id; this.publishRoom(); }
          else c.publish(this.topic('room'), '', {qos: 1, retain: true});
        }
        c.publish(this.topic('p/' + this.me.id), '', {qos: 1, retain: true});
        c.end(false);
      }catch{ try{ c.end(true); }catch{} }
    }
    this.reset();
    sess.del('room');
    setUrl(null);
    if (!silent) toast('You left the room.');
  },
  sendEmo(e){
    if (!REACTIONS.includes(e) || Date.now() - this.lastEmo < 700) return;
    this.lastEmo = Date.now();
    this.send({t: 'emo', e});
  },
  showEmo(ev){
    if (!REACTIONS.includes(ev.e)) return;
    const p = this.players.get(ev.id);
    const el = document.createElement('div');
    el.className = 'rx';
    el.style.right = Math.floor(Math.random() * 70) + 'px';
    el.innerHTML = `<span class="e">${ev.e}</span><span>${esc(p ? p.name : 'Someone')}</span>`;
    $('rxlayer').append(el);
    setTimeout(() => el.remove(), 2900);
    SND.pop();
  },

  /* ---------- Views ---------- */
  boardRows(){
    const r = this.room; if (!r) return [];
    const ids = r.status === 'lobby' ? [...this.players.keys()] : [...new Set([...r.racers, ...this.players.keys()])];
    const rows = ids.map(id => {
      const p = this.players.get(id) || r.scores[id] || {name: 'Player', avatar: '🙂'};
      return {id, name: p.name, avatar: p.avatar, here: this.players.has(id), racer: r.racers.includes(id), prog: this.prog.get(id), fin: this.fins.get(id) || r.results[id], score: r.scores[id]};
    });
    const key = x => x.fin ? (x.fin.won ? 0 : 2) : x.racer ? 1 : 3;
    return rows.sort((a, b) => key(a) - key(b) || (a.fin && b.fin && a.fin.won && b.fin.won ? (r.cfg.mode === 'time' ? a.fin.ms - b.fin.ms : a.fin.c - b.fin.c || a.fin.ms - b.fin.ms) : 0) || (b.score?.pts || 0) - (a.score?.pts || 0) || String(a.name).localeCompare(b.name));
  },
  statusText(x){
    const r = this.room;
    if (!x.here && !x.fin) return 'left the room';
    if (r.status === 'lobby') return x.score ? plural(x.score.wins, 'win') : (x.id === this.me.id ? 'that’s you' : 'ready');
    if (!x.racer) return 'watching';
    if (x.fin){
      if (x.fin.won) return `🏁 ${plural(x.fin.c, 'click')} · ${fmtTime(x.fin.ms)}`;
      return {time: '⏰ out of time', clicks: '🎲 out of clicks', gaveup: '🏳️ gave up', left: '💨 left'}[x.fin.why] || '💨 did not finish';
    }
    if (x.prog) return `🏃 ${plural(x.prog.c, 'click')}${r.cfg.spy && x.prog.p ? ' · on ' + x.prog.p : ''}`;
    return r.status === 'countdown' ? 'getting ready' : '🏃 reading the start page';
  },
  boardHTML(){
    const r = this.room; if (!r) return '';
    return `<ul class="plist">${this.boardRows().map(x => `<li class="${x.id === this.me.id ? 'me' : ''}${x.here ? '' : ' gone'}"><span class="av">${x.avatar}</span><span class="nm">${esc(x.name)}${x.id === r.host ? ' 👑' : ''}<small>${esc(this.statusText(x))}</small></span><span class="sc">${x.score ? x.score.pts + ' pts' : ''}</span></li>`).join('')}</ul>`;
  },
  refreshBoard(){
    $$('.board-slot').forEach(el => { el.innerHTML = this.boardHTML(); });
    if (R && R.extra.room && !R.ended) $('roomtag').innerHTML = this.tagText();
  },
  tagText(){
    const r = this.room; if (!r) return '';
    const n = r.racers.length || this.players.size;
    const done = r.racers.filter(id => this.fins.has(id) || r.results[id]).length;
    return `👥 ${done}/${n}<span class="rl"> done</span>`;
  },
  render(){
    const r = this.room;
    if (!r || !this.client) return;
    if (R && R.extra.room && !R.ended){ this.refreshBoard(); updateHud(); return; }
    if (!$('cdown').hidden) return;
    document.body.classList.remove('racing');
    setHud(false);
    // Jump to the top when the screen changes (lobby → results and so on), not on every refresh.
    const view = r.status + '|' + r.round + '|' + r.racers.includes(this.me.id);
    if (view !== this.view){ this.view = view; window.scrollTo(0, 0); }
    if (r.status === 'lobby') return this.renderLobby();
    if (r.status === 'results') return this.renderResults();
    if (!r.racers.includes(this.me.id)) return this.renderWaiting(true);
    return this.renderWaiting(false);
  },
  head(sub, title, extra = ''){
    return `<div class="room-head"><div><span class="eyebrow">${sub}</span><h1>${title}</h1><p class="connstate${this.conn === 'ok' ? '' : ' bad'}" id="connstate">${esc(this.connText())}</p></div>
      <div class="invite">${extra}<button data-act="copyinvite">🔗 Copy invite link</button><button class="ghost" data-act="leaveroom">Leave</button></div></div>`;
  },
  renderLobby(){
    const r = this.room, host = this.isHost(), m = r.cfg.twists.includes('mystery');
    const hostP = this.players.get(r.host);
    const tcard = r.pair ? (m ? {title: '???', desc: maskTitle(r.pair.target.desc, r.pair.target), img: ''} : r.pair.target) : null;
    const pairHTML = r.pair
      ? `<div class="preview">${startCardHTML(r.pair.start)}<div class="arrow" aria-hidden="true">→</div>${startCardHTML(tcard, m ? 'Mystery target' : 'Target')}</div>${r.pair.label ? `<p class="quip muted">${esc(r.pair.label)}</p>` : ''}${r.pair.combo && r.pair.combo.startsWith('tr-') ? '<p class="muted" style="font-size:14px">💡 Trivia trail: the fact is revealed at the finish.</p>' : ''}`
      : `<p class="waiting"><span class="dots">${host ? 'Picking a pair' : 'The host is picking a pair'}</span></p>`;
    $('app').innerHTML = `<section class="room">
      ${this.head(`Room · ${esc(langName(r.cfg.lang))} Wikipedia`, `Room <span class="code">${esc(this.code)}</span>`,
        `<a class="pill" href="https://wa.me/?text=${encodeURIComponent('Race me through Wikipedia! Room ' + this.code + ': ' + this.inviteUrl())}" target="_blank" rel="noopener">WhatsApp</a><button data-act="showqr">▦ QR code</button>`)}
      <div id="qrBox" hidden></div>
      <div class="room-grid">
        <div class="card"><h2>Players · ${this.players.size}</h2><div class="board-slot">${this.boardHTML()}</div>${reactionBar()}
          <p class="muted" style="font-size:14px">Friends join with the link, the QR code or the code <b>${esc(this.code)}</b> on the home page.</p></div>
        <div class="card"><h2>Next race</h2>${pairHTML}<div class="pills">${roomPills(r.cfg)}</div>
          ${host ? this.hostSetupHTML() : `<p class="waiting"><span class="dots">Waiting for ${esc(hostP ? hostP.name : 'the host')} to start</span></p>`}</div>
      </div>
    </section>`;
  },
  hostSetupHTML(){
    const r = this.room, s = r.src, cats = allCats();
    const opt = (v, n, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(n)}</option>`;
    return `<div class="setupgrid">
      <label>Pairs from<select data-ch="rsrc">${[['random', '🎲 Random articles'], ['cats', '🗂️ Categories'], ['trivia', '💡 Trivia trails'], ['silly', '🤪 Silly pairs']].map(([v, n]) => opt(v, n, s.kind === v)).join('')}</select></label>
      ${s.kind === 'cats' ? `<div class="row" style="flex-wrap:nowrap;align-items:flex-end"><label style="flex:1;min-width:0">From<select data-ch="rfrom">${cats.map(c => opt(c.id, c.e + ' ' + c.n, s.from === c.id)).join('')}</select></label><label style="flex:1;min-width:0">To<select data-ch="rto">${cats.map(c => opt(c.id, c.e + ' ' + c.n, s.to === c.id)).join('')}</select></label></div>` : ''}
      ${s.kind === 'trivia' || s.kind === 'silly' ? `<label>Which one<select data-ch="rcombo">${opt('', '🎲 Surprise me', !s.combo)}${COMBOS.filter(c => c.kind === s.kind).map(c => opt(c.id, `${c.e} ${c.s} → ${c.t}`, s.combo === c.id)).join('')}</select></label>` : ''}
      <div class="row"><button data-act="rollpair"${this.busy ? ' disabled' : ''}>${this.busy ? 'Rolling…' : '🎲 New pair'}</button></div>
      <label>Mode<select data-ch="rmode">${Object.entries(MODES).map(([id, mo]) => opt(id, `${mo.e} ${mo.n}`, r.cfg.mode === id)).join('')}</select></label>
      ${r.cfg.mode === 'time' ? `<label>Time limit<select data-ch="rtime">${TIME_LIMITS.map(t => opt(t, fmtTime(t * 1000), r.cfg.timeLimit === t)).join('')}</select></label>` : ''}
      <div><span class="eyebrow">Twists</span><div class="mini-twists">${Object.entries(TWISTS).map(([id, t]) => `<button data-act="rtwist" data-id="${id}" aria-pressed="${r.cfg.twists.includes(id)}">${t.e} ${esc(t.n)}</button>`).join('')}</div></div>
      <label>Wikipedia<select data-ch="rlang">${LANGS.map(l => opt(l.code, l.name, r.cfg.lang === l.code)).join('')}</select></label>
      <label class="check"><input type="checkbox" data-ch="rspy"${r.cfg.spy ? ' checked' : ''}> Show which page everyone is on</label>
      <label class="check"><input type="checkbox" data-ch="rnav"${r.cfg.navboxes ? ' checked' : ''}> Navigation boxes (easier)</label>
      <button class="go" data-act="startround" id="startRound"${r.pair && !this.busy ? '' : ' disabled'} style="min-height:48px;font-size:16px">▶ Start the race</button>
    </div>`;
  },
  renderWaiting(spectator){
    const r = this.room, mine = this.fins.get(this.me.id);
    const title = spectator ? 'A round is in progress' : mine && mine.won ? `🏁 You made it in ${plural(mine.c, 'click')}` : mine ? '😵 You are out of this round' : 'Round in progress';
    $('app').innerHTML = `<section class="room">
      ${this.head(`Room ${esc(this.code)} · round ${r.round}`, esc(title), this.isHost() ? '<button data-act="endround">⏹ End round now</button>' : '')}
      ${spectator ? '<p class="muted">You joined in the middle of a race. You will play from the next round.</p>' : ''}
      ${mine && mine.won ? `<p class="muted">Time ${fmtTime(mine.ms)} · route: ${mine.path.map(esc).join(' › ')}</p>` : ''}
      <div class="card"><h2>Live board</h2><div class="board-slot">${this.boardHTML()}</div><p class="waiting"><span class="dots">Waiting for the others</span></p>${reactionBar()}</div>
    </section>`;
  },
  renderResults(){
    const r = this.room, host = this.isHost();
    const rows = r.racers.map(id => ({id, p: this.players.get(id) || r.scores[id] || {name: 'Player', avatar: '🙂'}, res: r.results[id] || this.fins.get(id)}));
    const rank = id => r.ranking.indexOf(id);
    rows.sort((a, b) => { const ra = rank(a.id), rb = rank(b.id); if (ra >= 0 && rb >= 0) return ra - rb; if (ra >= 0) return -1; if (rb >= 0) return 1; return (b.res?.c || 0) - (a.res?.c || 0); });
    const top = r.ranking.slice(0, 3).map(id => rows.find(x => x.id === id)).filter(Boolean);
    const podium = top.length ? `<div class="podium">${[1, 0, 2].map(i => top[i] ? `<div class="p${i + 1}"><span class="av">${top[i].p.avatar}</span><span class="nm">${esc(top[i].p.name)}</span><span class="muted" style="font-size:13px">${plural(top[i].res.c, 'click')} · ${fmtTime(top[i].res.ms)}</span><span class="blk">${i + 1}</span></div>` : '<div></div>').join('')}</div>` : '';
    const scores = Object.entries(r.scores).sort((a, b) => b[1].pts - a[1].pts || b[1].wins - a[1].wins);
    $('app').innerHTML = `<section class="room" id="roomResults">
      ${this.head(`Room ${esc(this.code)} · round ${r.round} · ${esc(r.pair ? r.pair.start.title + ' → ' + r.pair.target.title : '')}`, top.length ? `🏆 ${esc(top[0].p.name)} wins!` : '🤷 Nobody made it')}
      ${podium}
      ${r.pair && r.pair.fact ? `<div class="fact"><span class="em">💡</span><p><b>Did you know?</b> ${esc(r.pair.fact)}</p></div>` : ''}
      <div class="room-grid">
        <div class="card"><h2>This round</h2>
          <table class="rtable"><thead><tr><th>#</th><th>Player</th><th>Clicks</th><th>Time</th></tr></thead><tbody>
          ${rows.map(x => `<tr><td class="n">${rank(x.id) >= 0 ? rank(x.id) + 1 : '–'}</td><td>${x.p.avatar} ${esc(x.p.name)}${x.res && x.res.path.length ? `<details><summary>route</summary><span class="pathtxt">${x.res.path.map(esc).join(' › ')}</span></details>` : ''}</td><td class="n">${x.res ? (x.res.won ? x.res.c : '✗') : '…'}</td><td class="n">${x.res && x.res.won ? fmtTime(x.res.ms) : esc(whyText(x.res))}</td></tr>`).join('')}
          </tbody></table></div>
        <div class="card"><h2>Scoreboard</h2>
          <ul class="plist">${scores.map(([id, s], i) => `<li class="${id === this.me.id ? 'me' : ''}"><span class="av">${s.avatar}</span><span class="nm">${i === 0 && s.pts > 0 ? '👑 ' : ''}${esc(s.name)}<small>${plural(s.wins, 'win')}</small></span><span class="sc">${s.pts} pts</span></li>`).join('')}</ul>
          <p class="muted" style="font-size:14px;margin:0">3 points for first place, 2 for second, 1 for third.</p>
          ${reactionBar()}</div>
      </div>
      <div class="res-acts">${host ? '<button class="go" data-act="nextround">▶ Next round</button>' : '<p class="waiting"><span class="dots">Waiting for the host to start the next round</span></p>'}</div>
    </section>`;
  },
  async showQR(){
    const box = $('qrBox'); if (!box) return;
    if (!box.hidden){ box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = '<p class="muted">Loading QR code…</p>';
    try{
      const q = await loadLib('qrcode');
      const qr = q(0, 'M'); qr.addData(this.inviteUrl()); qr.make();
      box.innerHTML = `<div class="row"><div class="qr">${qr.createSvgTag({cellSize: 4, margin: 2, scalable: true})}</div><p class="muted" style="max-width:32ch">Point a phone camera here to join room ${esc(this.code)}.</p></div>`;
    }catch(e){ box.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
  }
};

function showJoin(code, hint){
  stopRace(); setHud(false);
  $('app').innerHTML = `<section class="room"><div class="card" style="max-width:560px;width:100%;margin:0 auto">
    <div class="card-h"><span class="em">👥</span><div><span class="eyebrow">Multiplayer</span><h2>Join room <span class="code">${esc(code)}</span></h2></div></div>
    <form data-form="dojoin" data-code="${esc(code)}" data-hint="${esc(hint ?? '')}">
      <label class="field">Your name<input type="text" id="joinName" maxlength="24" value="${esc(SET.name)}" autocomplete="nickname"></label>
      <span class="eyebrow">Avatar</span>
      <div class="avatars" style="margin:6px 0 14px">${AVATARS.map(a => `<button type="button" data-act="avatar" data-a="${a}" aria-pressed="${a === SET.avatar}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div>
      <div class="row"><button type="submit" class="go" id="joinBtn">Join the room</button><button type="button" class="ghost" data-act="home">Cancel</button></div>
      <p class="muted" id="joinErr"></p>
    </form></div></section>`;
}
async function joinRoom(code, hint, btn, errEl){
  if (btn){ btn.disabled = true; btn.dataset.label = btn.innerHTML; btn.textContent = 'Connecting…'; }
  try{
    await MP.join(code, hint);
    MP.applyRoom();
  }catch(e){
    if (errEl) errEl.textContent = e.message; else toast(e.message);
    if (btn && btn.isConnected){ btn.disabled = false; btn.innerHTML = btn.dataset.label; delete btn.dataset.label; }
  }
}
async function createRoom(btn){
  const err = $('roomErr');
  if (err) err.textContent = '';
  if (btn){ btn.disabled = true; btn.textContent = 'Connecting…'; }
  try{
    await MP.create();
    MP.applyRoom();
    MP.rollPair();
  }catch(e){
    if (err) err.textContent = e.message; else toast(e.message);
    if (btn && btn.isConnected){ btn.disabled = false; btn.textContent = 'Create a room'; }
  }
}

/* =====================================================================

function goHome(){
  if (MP.active()) MP.leave();
  CHALLENGE = null;
  closeModal();
  renderHome();
  window.scrollTo(0, 0);
}
function toggleTwist(id){
  if (!TWISTS[id]) return;
  const i = SETUP.twists.indexOf(id);
  if (i >= 0) SETUP.twists.splice(i, 1); else SETUP.twists.push(id);
  saveSetup(); renderTwists(); renderHero();
}

const ACTIONS = {
  home: goHome,
  start(){ if (HOME.pair && !HOME.loading) startRace(HOME.pair, cfgFromSetup(), {}); },
  newpair(){
    if ((SETUP.src === 'trivia' || SETUP.src === 'silly')){ SETUP.combo = randomCombo(SETUP.src); saveSetup(); renderSrc(); }
    newPair();
  },
  retrystart(){ if (R) startRace(R.pair, {...R.cfg, twists: [...R.cfg.twists]}, R.extra); },
  more(el){ const p = el.closest('.in')?.querySelector('.ext'); if (p) p.classList.remove('clamp'); el.remove(); },
  tab(el){
    const t = el.dataset.tab;
    if (!SRC_TABS.some(x => x.id === t)) return;
    SETUP.src = t;
    if ((t === 'trivia' || t === 'silly') && !(COMBOS.find(c => c.id === SETUP.combo && c.kind === t))) SETUP.combo = randomCombo(t);
    saveSetup(); renderSrc();
    if (t !== 'words') newPair();
  },
  pickcat(el){
    const side = el.dataset.side === 'to' ? 'to' : 'from';
    if (!findCat(el.dataset.id)) return;
    SETUP[side] = el.dataset.id; SETUP.src = 'cats';
    saveSetup(); renderSrc(); newPair();
  },
  surprise(){
    const [a, b] = shuffle(BUILTIN_CATS).slice(0, 2);
    SETUP.from = a.id; SETUP.to = b.id; SETUP.src = 'cats';
    saveSetup(); renderSrc(); newPair();
  },
  nicecombo(el){
    if (!findCat(el.dataset.a) || !findCat(el.dataset.b)) return;
    SETUP.from = el.dataset.a; SETUP.to = el.dataset.b; SETUP.src = 'cats';
    saveSetup(); renderSrc(); newPair();
    $('hero')?.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start'});
  },
  combo(el){
    const c = COMBOS.find(x => x.id === el.dataset.id); if (!c) return;
    SETUP.src = c.kind; SETUP.combo = c.id;
    saveSetup(); renderSrc(); newPair();
    $('hero')?.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start'});
  },
  mode(el){ if (!MODES[el.dataset.id]) return; SETUP.mode = el.dataset.id; saveSetup(); renderModes(); refreshPills(); },
  timelimit(el){ const v = +el.dataset.v; if (!TIME_LIMITS.includes(v)) return; SETUP.timeLimit = v; saveSetup(); renderModes(); refreshPills(); },
  twist(el){ toggleTwist(el.dataset.id); },
  goto(el){ $(el.dataset.to)?.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start'}); },
  daily(el){ startDaily(el); },
  dailyshare(el){ const t = dailyShareText(); if (t) shareOrCopy(t, el); },
  challengepair(el){
    if (!HOME.pair) return;
    const p = HOME.pair;
    copyText(challengeUrl({lang: p.lang, startTitle: p.start.title, targetTitle: p.target.title, mode: SETUP.mode, timeLimit: SETUP.timeLimit, twists: SETUP.twists, navboxes: SET.navboxes, won: false}, false), el);
  },
  stats: openStats,
  settings: openSettings,
  resetstats(el){ resetStats(el); },
  closemodal: closeModal,
  avatar(el){
    if (!AVATARS.includes(el.dataset.a)) return;
    SET.avatar = el.dataset.a; saveSettings();
    el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    if (MP.active()) MP.publishPresence();
  },
  theme(el){
    SET.theme = ['auto', 'light', 'dark'].includes(el.dataset.v) ? el.dataset.v : 'auto'; saveSettings();
    el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
  },
  newcat(){ openCatEditor(null); },
  editcat(el){ openCatEditor(el.dataset.id); },
  sharecat(el){ shareCat(el.dataset.id, el); },
  cekind(el){ syncCatEditor(); CAT_EDIT.kind = el.dataset.v === 'wikicat' ? 'wikicat' : 'list'; renderCatEditor(); },
  cesugg(el){
    const v = el.dataset.v;
    if ($('ceItems')){
      const ta = $('ceItems');
      const lines = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
      if (!lines.some(l => norm(l) === norm(v))) lines.push(v);
      ta.value = lines.join('\n'); $('ceCount').textContent = lines.length;
      el.remove(); $('ceSearch').focus();
    } else if ($('ceCat')){ $('ceCat').value = v; $('ceSugg').innerHTML = ''; catTest(); }
  },
  cetest: catTest,
  cesave: catSave,
  cedel(el){ catDelete(el); },
  acceptcat: acceptSharedCat,
  acceptch: acceptChallenge,

  // race
  back,
  hint,
  peek,
  giveup(el){ giveUp(el); },
  find(){ FIND.open(); },
  findclose(){ FIND.close(); },
  sheet(){ if (!isWide()) openSheet(); },
  closesheet: closeSheet,

  // results
  again(){
    const g = LAST; if (!g) return;
    startRace(g.pair, {mode: g.mode, timeLimit: g.timeLimit, twists: g.twists, navboxes: g.navboxes}, {daily: g.daily, dailyRepeat: !!g.daily, challenge: g.challenge});
  },
  nextrace(){ $('app').innerHTML = `<p class="msg">${esc(pick(LOAD_LINES))}</p>`; HOME.pair = null; newPair(true); },
  challenge(el){ if (LAST) copyText(challengeUrl(LAST, true), el); },
  share(el){ if (LAST) shareOrCopy(shareText(LAST) + '\n' + (LAST.daily ? baseUrl() : challengeUrl(LAST, true)), el); },

  // rooms
  mkroom(el){ createRoom(el); },
  copyinvite(el){ copyText(MP.inviteUrl(), el); },
  showqr(){ MP.showQR(); },
  leaveroom(){ MP.leave(); renderHome(); },
  rollpair(){ MP.rollPair(); },
  startround(){ MP.startRound(); },
  endround(){ if (MP.isHost()) MP.endRound(); },
  nextround(){ MP.nextRound(); },
  rtwist(el){
    if (!MP.isHost() || !TWISTS[el.dataset.id]) return;
    const t = MP.room.cfg.twists.slice(), i = t.indexOf(el.dataset.id);
    if (i >= 0) t.splice(i, 1); else t.push(el.dataset.id);
    MP.setCfg({twists: t});
  },
  emo(el){ MP.sendEmo(el.dataset.e); }
};

const FORMS = {
  join(f){
    const code = (f.querySelector('#joincode').value || '').trim().toUpperCase().replace(/[^A-Z]/g, '');
    const err = $('roomErr');
    if (!/^[A-Z]{5}$/.test(code)){ if (err) err.textContent = 'Room codes have 5 letters.'; return; }
    joinRoom(code, null, f.querySelector('button[type=submit]'), err);
  },
  dojoin(f){
    const name = $('joinName').value.trim();
    if (name){ SET.name = name.slice(0, 24); saveSettings(); }
    joinRoom(f.dataset.code, f.dataset.hint === '' ? null : f.dataset.hint, $('joinBtn'), $('joinErr'));
  },
  words(){
    SETUP.ws = $('ws').value.trim().slice(0, 200); SETUP.wt = $('wt').value.trim().slice(0, 200); SETUP.src = 'words';
    saveSetup(); newPair();
    $('hero')?.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start'});
  },
  find(){ FIND.next(); }
};

const CHANGES = {
  lang(el){
    if (!LANGS.some(l => l.code === el.value)) return;
    SET.lang = el.value; saveSettings(); HOME.lang = SET.lang;
    newPair(); fillDaily();
  },
  navboxes(el){ SET.navboxes = el.checked; saveSettings(); $$('[data-ch="navboxes"]').forEach(x => { x.checked = el.checked; }); },
  sound(el){ SET.sound = el.checked; saveSettings(); if (el.checked) SND.pop(); },
  previews(el){ SET.previews = el.checked; saveSettings(); },
  rsrc(el){ MP.setSrc({kind: el.value, combo: null}); },
  rfrom(el){ MP.setSrc({from: el.value}); },
  rto(el){ MP.setSrc({to: el.value}); },
  rcombo(el){ MP.setSrc({combo: el.value || null}); },
  rmode(el){ if (MODES[el.value]) MP.setCfg({mode: el.value}); },
  rtime(el){ if (TIME_LIMITS.includes(+el.value)) MP.setCfg({timeLimit: +el.value}); },
  rlang(el){ if (LANGS.some(l => l.code === el.value)) MP.setCfg({lang: el.value}, true); },

  rnav(el){ MP.setCfg({navboxes: el.checked}); }

let WORD_TIMER = null;
const INPUTS = {
  cesearch(el){ catSuggest(el, 0); },
  cecat(el){ catSuggest(el, 14); },
  ceitems(el){ const n = el.value.split('\n').map(s => s.trim()).filter(Boolean).length; if ($('ceCount')) $('ceCount').textContent = n; }

document.addEventListener('click', e => {
  const tog = e.target.closest('.paper .wr-toggle');
  if (tog){
    e.preventDefault();
    const box = tog.closest('.mw-collapsible, .NavFrame');
    if (box) tog.textContent = box.classList.toggle('wr-collapsed') ? 'show' : 'hide';
    return;
  }
  const a = e.target.closest('.paper a');
  if (a){
    e.preventDefault();
    if (a.classList.contains('ok') && R && !R.ended){ SND.click(); LP.hide(); go(a.dataset.title); }
    return;
  }
  if (e.target.closest('.paper .blocked')){ toast('🚧 Hub pages are blocked in No shortcuts.'); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && !el.getAttribute('href')?.startsWith('#')) return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form]?.(f);
});
document.addEventListener('change', e => { const ch = e.target.dataset?.ch; if (ch && CHANGES[ch]) CHANGES[ch](e.target); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset?.in && INPUTS[t.dataset.in]) return INPUTS[t.dataset.in](t);
  if (t.id === 'findq') return FIND.run(t.value);
  if (t.id === 'setName'){ SET.name = t.value.trim().slice(0, 24) || SET.name; saveSettings(); if (MP.active()) { clearTimeout(WORD_TIMER); WORD_TIMER = setTimeout(() => MP.publishPresence(), 600); } return; }
  if (t.id === 'setBroker'){ const v = t.value.trim(); SET.broker = /^wss?:\/\/\S+$/i.test(v) ? v : ''; saveSettings(); return; }
  if (t.id === 'ws' || t.id === 'wt'){
    clearTimeout(WORD_TIMER);
    WORD_TIMER = setTimeout(async () => {
      const list = await W.suggest(SET.lang, t.value);
      const dl = $(t.id === 'ws' ? 'wsList' : 'wtList');
      if (dl) dl.innerHTML = list.map(x => `<option value="${esc(x)}"></option>`).join('');
    }, 250);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (!$('modal').hidden) return closeModal();
    if (!$('findbar').hidden) return FIND.close();
    closeSheet(); LP.hide();
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.metaKey || e.ctrlKey || e.altKey || !$('modal').hidden) return;
  if (!R || R.ended) return;
  const k = e.key.toLowerCase();
  if (k === '/'){ e.preventDefault(); FIND.open(); }
  else if (k === 'b') back();
  else if (k === 'h') hint();
  else if (k === 't') openSheet();
});
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

// Hover previews of linked articles (mouse only).
document.addEventListener('mouseover', e => {
  if (!SET.previews || !canHover() || !R || R.ended || R.cfg.twists.has('invisible')) return;
  const a = e.target.closest?.('.paper a.ok');
  if (a) LP.over(a);
});
document.addEventListener('mouseout', e => {
  const a = e.target.closest?.('.paper a.ok');
  if (a && !(e.relatedTarget && a.contains(e.relatedTarget))) LP.hide();
});
addEventListener('scroll', () => { if (!$('lp').hidden) LP.hide(); }, {passive: true});

// The phone's back gesture goes back one article instead of leaving the game.
addEventListener('popstate', () => {
  if (!R || R.ended) return;
  try{ history.pushState({wr: 1}, ''); }catch{}
  if (!$('modal').hidden) closeModal();
  else if (document.body.classList.contains('sheet-open')) closeSheet();
  else if (!$('findbar').hidden) FIND.close();
  else if (R.cfg.twists.has('noback')) toast('🚫 No going back in this race.');
  else back();
});

function boot(){
  applyTheme();
  const qp = new URLSearchParams(location.search);
  if (qp.get('broker') && /^wss?:\/\/\S+$/i.test(qp.get('broker'))) MP.override = qp.get('broker');
  const room = (qp.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (/^[A-Z]{5}$/.test(room)){
    const prev = sess.get('room');
    if (prev && prev.code === room){ $('app').innerHTML = `<p class="msg">Reconnecting to room ${esc(room)}…</p>`; joinRoom(room, qp.get('b'), null, null).then(() => { if (!MP.active()) showJoin(room, qp.get('b')); }); }
    else showJoin(room, qp.get('b'));
    return;
  }
  if (qp.get('c')){
    const c = cleanChallenge(b64urlDecode(qp.get('c')));
    if (c){ showChallenge(c); return; }
    toast('That challenge link looks broken.');
  }
  renderHome();
  if (qp.get('cat')){
    const c = cleanSharedCat(b64urlDecode(qp.get('cat')));
    if (c) offerSharedCat(c); else toast('That category link looks broken.');
  }
  if (qp.has('daily')){ setUrl(null); startDaily(); }
}
if (!window.WR_TEST) boot();
</script>
