<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki Race</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky scoreboard on top, article reading column below */
:root{
  --bg:#f6f7f4; --paper:#ffffff; --ink:#1d2321; --muted:#66706b;
  --line:#dde2dc; --link:#1c5fa8; --accent:#c2410c; --good:#1f7a4d;
  --display:"Fraunces",Georgia,serif; --body:"Source Serif 4",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141816; --paper:#1b201e; --ink:#e7ebe8; --muted:#97a19c;
  --line:#2c3330; --link:#7fb2ec; --accent:#f08a4b; --good:#5cc08b; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 16px}
.bar{max-width:820px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
h1{font:600 22px var(--display);margin:0}
.route{display:flex;gap:8px;align-items:center;flex:1;min-width:0;font-size:15px}
.route b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route .to{color:var(--accent)}
.stats{display:flex;gap:16px;font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.stats span em{font-style:normal;color:var(--muted);margin-right:4px}
.controls{max-width:820px;margin:8px auto 0;display:flex;flex-wrap:wrap;gap:8px}
button,select{font:500 13px var(--mono);padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:820px;margin:0 auto;padding:20px 16px 80px}
.title{font:600 32px/1.2 var(--display);margin:0 0 4px;text-wrap:balance}
.path{font:13px var(--mono);color:var(--muted);margin-bottom:20px;word-break:break-word}
article{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 24px 24px;overflow-wrap:break-word}
article h2,article h3{font-family:var(--display);font-weight:600;margin:1.4em 0 .4em}
article a.ok{color:var(--link);text-decoration:none;border-bottom:1px solid transparent}
article a.ok:hover{border-bottom-color:var(--link)}
article a.ok.goal{color:var(--good);font-weight:600}
article .dead{color:inherit;text-decoration:none;cursor:text}
article img,article figure,article table,article .mw-editsection,article sup.reference{display:none}
.msg{padding:40px 0;color:var(--muted);text-align:center}
.win{background:var(--paper);border:2px solid var(--good);border-radius:8px;padding:24px;text-align:center}
.win h2{font:600 28px var(--display);color:var(--good);margin:0 0 8px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Wiki Race</h1>
    <div class="route"><b id="from">…</b><span>→</span><b class="to" id="to">…</b></div>
    <div class="stats">
      <span><em>clicks</em><b id="clicks">0</b></span>
      <span><em>time</em><b id="time">0:00</b></span>
    </div>
  </div>
  <div class="controls">
    <select id="lang" aria-label="Wikipedia language">
      <option value="en">English</option><option value="it">Italiano</option>
      <option value="fr">Français</option><option value="de">Deutsch</option>
    </select>
    <button id="newgame">New game</button>
    <button id="back">Back (+1 click)</button>
    <button id="peek">Show target article</button>
  </div>
</header>
<main>
  <div id="view"><p class="msg">Loading…</p></div>
</main>

<script>
const S = {lang:'en', start:'', target:'', current:'', clicks:0, path:[], t0:0, timer:null, done:false};
const $ = id => document.getElementById(id);
const api = () => `https://${S.lang}.wikipedia.org/w/api.php`;

// Sections whose links do not count (references, see also, etc.)
const SKIP_SECTIONS = /^(see also|references|notes|external links|further reading|bibliography|sources|citations|voci correlate|note|collegamenti esterni|bibliografia|altri progetti|voir aussi|références|liens externes|notes et références|siehe auch|literatur|weblinks|einzelnachweise)$/i;

async function randomTitle(){
  // Pick a random article with some substance (at least ~8 KB of text)
  for (let i=0;i<5;i++){
    const u = `${api()}?action=query&format=json&origin=*&generator=random&grnnamespace=0&grnlimit=10&prop=info`;
    const d = await (await fetch(u)).json();
    const pages = Object.values(d.query.pages).filter(p => p.length > 8000 && !/\(disambiguation\)|disambigua/i.test(p.title));
    if (pages.length) return pages[0].title;
  }
  throw new Error('Could not find a random article. Check your connection and try again.');
}

async function loadArticle(title){
  const u = `${api()}?action=parse&format=json&origin=*&redirects=1&prop=text|displaytitle&disableeditsection=1&page=${encodeURIComponent(title)}`;
  const d = await (await fetch(u)).json();
  if (d.error) throw new Error(d.error.info);
  return {title:d.parse.title, html:d.parse.text['*']};
}

function norm(t){ return decodeURIComponent(t).replace(/_/g,' ').trim().toLowerCase(); }

function cleanBody(html){
  const doc = new DOMParser().parseFromString(html,'text/html');
  const root = doc.querySelector('.mw-parser-output') || doc.body;
  // Remove everything that is not running text of the article chapters
  root.querySelectorAll('table, .infobox, .navbox, .sidebar, .vertical-navbox, .hatnote, .dablink, .metadata, .ambox, .reflist, .references, .mw-references-wrap, .thumb, figure, .gallery, .toc, #toc, style, .shortdescription, .noprint, .portal, .portalbox, sup.reference, .mw-empty-elt').forEach(e=>e.remove());

  // Drop the trailing sections like References, See also
  let skipping = false;
  [...root.children].forEach(el=>{
    const head = el.matches('h2, .mw-heading2') ? el : null;
    if (head){ skipping = SKIP_SECTIONS.test(head.textContent.trim()); }
    if (skipping) el.remove();
  });

  // Keep only normal article links found in paragraphs and lists
  root.querySelectorAll('a').forEach(a=>{
    const href = a.getAttribute('href') || '';
    const m = href.match(/^\/wiki\/([^#?]+)/);
    const inText = a.closest('p, li, dd');
    if (m && inText && !decodeURIComponent(m[1]).includes(':') && !a.classList.contains('new')){
      const t = decodeURIComponent(m[1]).replace(/_/g,' ');
      a.className = 'ok';
      a.dataset.title = t;
      a.href = '#';
      a.removeAttribute('title');
      if (norm(t) === norm(S.target)) a.classList.add('goal');
    } else {
      const s = doc.createElement('span');
      s.className = 'dead';
      s.innerHTML = a.innerHTML;
      a.replaceWith(s);
    }
  });
  return root.innerHTML;
}

async function show(title, countClick){
  $('view').innerHTML = '<p class="msg">Loading…</p>';
  try{
    const art = await loadArticle(title);
    if (countClick){ S.clicks++; $('clicks').textContent = S.clicks; }
    S.current = art.title;
    S.path.push(art.title);
    if (norm(art.title) === norm(S.target)) return win();
    $('view').innerHTML = `<h2 class="title">${art.title}</h2>
      <div class="path">${S.path.join(' → ')}</div>
      <article>${cleanBody(art.html)}</article>`;
    window.scrollTo(0,0);
  }catch(e){
    $('view').innerHTML = `<p class="msg">${e.message}</p>`;
  }
}

function win(){
  S.done = true; clearInterval(S.timer);
  $('view').innerHTML = `<div class="win"><h2>You made it</h2>
    <p>${S.start} → ${S.target} in <b>${S.clicks}</b> clicks and <b>${$('time').textContent}</b>.</p>
    <div class="path">${S.path.join(' → ')}</div>
    <button onclick="newGame()">Play again</button></div>`;
}

function tick(){
  const s = Math.floor((Date.now()-S.t0)/1000);
  $('time').textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

async function newGame(){
  clearInterval(S.timer);
  Object.assign(S,{clicks:0,path:[],done:false});
  $('clicks').textContent = 0; $('time').textContent = '0:00';
  $('from').textContent = '…'; $('to').textContent = '…';
  $('view').innerHTML = '<p class="msg">Picking two random articles…</p>';
  try{
    S.start = await randomTitle();
    do { S.target = await randomTitle(); } while (S.target === S.start);
  }catch(e){ $('view').innerHTML = `<p class="msg">${e.message}</p>`; return; }
  $('from').textContent = S.start; $('to').textContent = S.target;
  S.t0 = Date.now(); S.timer = setInterval(tick,1000);
  show(S.start,false);
}

$('view').addEventListener('click', e=>{
  const a = e.target.closest('a.ok');
  if (!a || S.done) return;
  e.preventDefault();
  show(a.dataset.title, true);
});
$('back').onclick = ()=>{
  if (S.path.length < 2 || S.done) return;
  S.path.pop(); const prev = S.path.pop();
  show(prev, true);
};
$('peek').onclick = ()=>{
  window.open(`https://${S.lang}.wikipedia.org/wiki/${encodeURIComponent(S.target)}`,'_blank');
};
$('newgame').onclick = newGame;
$('lang').onchange = e=>{ S.lang = e.target.value; newGame(); };

newGame();
</script>
</body>
</html>
