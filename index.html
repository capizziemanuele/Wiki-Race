const CAT_NOISE = /articles|pages|wikipedia|wikidata|cs1|webarchive|use dmy|use mdy|short description|voci|pagine|articoli|artikel|seiten|página|páginas|artículos|bladzijden|stubs|commons/i;
const FALLBACK_NS = /^(portal|portale|portail|portaal|file|image|immagine|fichier|datei|bild|archivo|arquivo|ficheiro|bestand|plik|fil|category|categoria|catégorie|kategorie|categoría|categorie|kategoria|kategori|template|modèle|vorlage|plantilla|predefinição|sjabloon|szablon|mall|wikipedia|wp|help|aiuto|aide|hilfe|ayuda|ajuda|pomoc|hjälp|special|speciale|spécial|spezial|especial|speciaal|specjalna|talk|discussione|discussion|diskussion|discusión|discussão|overleg|dyskusja|user|utente|utilisateur|benutzer|usuario|usuário|utilizador|gebruiker|użytkownik|wikipedysta|användare|mediawiki|module|modulo|modul|módulo|draft|bozza|brouillon|entwurf|borrador|media|progetto|projet|anhang|anexo|wikiproject|wikiprojekt)\s*:/i;

const W = {
  cache: {sum: new Map(), art: new Map(), ns: new Map(), tr: new Map(), cat: new Map(), back: new Map(), info: new Map(), feed: new Map()},
  api: lang => `https://${lang}.wikipedia.org/w/api.php`,
  url(lang, params){ return `${this.api(lang)}?${new URLSearchParams({format: 'json', origin: '*', ...params})}`; },

  async json(url, {timeout = 15000, retries = 1} = {}){
    let lastErr;
    for (let i = 0; i <= retries; i++){
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), timeout);
      try{
        const r = await fetch(url, {signal: ctl.signal});
        if (r.ok) return await r.json();
        const e = new Error(r.status === 404 ? 'Not found' : `Wikipedia answered with an error (${r.status}). Try again in a moment.`);
        e.status = r.status;
        if (r.status !== 429 && r.status < 500) throw e;
        lastErr = e;
      }catch(e){
        if (e.status) throw e;
        lastErr = new Error('Could not reach Wikipedia. Check your connection and try again.');
      }finally{ clearTimeout(timer); }
      if (i < retries) await sleep(700 * (i + 1));
    }
    throw lastErr;
  },

  async random(lang){
    for (let i = 0; i < 6; i++){
      const d = await this.json(this.url(lang, {action: 'query', generator: 'random', grnnamespace: 0, grnlimit: 15, prop: 'info|pageprops', ppprop: 'disambiguation'}));
      const pages = Object.values(d.query?.pages || {});
      const p = pages.find(p => p.length > 9000 && !(p.pageprops && 'disambiguation' in p.pageprops) && !/^(list|lista|liste|lijst|anexo|listan) /i.test(p.title));
      if (p) return p.title;
    }
    throw new Error('Could not find a random article. Try again.');
  },

  async search(lang, word){
    const d = await this.json(this.url(lang, {action: 'query', list: 'search', srnamespace: 0, srlimit: 1, srsearch: word}));
    const hit = d.query?.search?.[0];
    if (!hit) throw new Error(`No article found for “${word}”.`);
    return hit.title;
  },

  async suggest(lang, q, ns = 0){
    if (!q || !q.trim()) return [];
    try{
      const d = await this.json(this.url(lang, {action: 'opensearch', search: q, namespace: ns, limit: 8, redirects: 'resolve'}), {retries: 0, timeout: 6000});
      return Array.isArray(d?.[1]) ? d[1] : [];
    }catch{ return []; }
  },

  async summary(lang, title){
    const key = lang + '|' + norm(title);
    if (this.cache.sum.has(key)) return this.cache.sum.get(key);
    try{
      const d = await this.json(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(String(title).replace(/ /g, '_'))}`, {retries: 1, timeout: 10000});
      const t = String(d.titles?.normalized || d.title || title).replace(/_/g, ' ');
      const out = {title: t, desc: d.description || '', extract: d.extract || '', img: d.thumbnail?.source || '', missing: false};
      this.cache.sum.set(key, out);
      return out;
    }catch(e){
      const out = {title, desc: '', extract: '', img: '', missing: e.status === 404};
      if (e.status === 404) this.cache.sum.set(key, out);
      return out;
    }
  },

  async namespaces(lang){
    if (this.cache.ns.has(lang)) return this.cache.ns.get(lang);
    try{
      const d = await this.json(this.url(lang, {action: 'query', meta: 'siteinfo', siprop: 'namespaces|namespacealiases'}), {retries: 1, timeout: 8000});
      const set = new Set();
      for (const ns of Object.values(d.query?.namespaces || {})){
        if (+ns.id === 0) continue;
        for (const n of [ns['*'], ns.canonical]) if (n) set.add(n.toLowerCase().replace(/_/g, ' '));
      }
      for (const a of d.query?.namespacealiases || []) if (+a.id !== 0 && a['*']) set.add(a['*'].toLowerCase().replace(/_/g, ' '));
      if (set.size){ this.cache.ns.set(lang, set); return set; }
    }catch{}
    return null;
  },

  async article(lang, title){
    const key = lang + '|' + norm(title);
    const hit = this.cache.art.get(key);
    if (hit){ this.cache.art.delete(key); this.cache.art.set(key, hit); return hit; }
    const d = await this.json(this.url(lang, {action: 'parse', redirects: 1, prop: 'text', disableeditsection: 1, disablelimitreport: 1, page: title}));
    if (d.error) throw new Error(d.error.code === 'missingtitle' ? `“${title}” does not exist on this Wikipedia.` : (d.error.info || 'Wikipedia could not open this page.'));
    const art = {title: d.parse.title, html: d.parse.text['*']};
    this.cache.art.set(key, art);
    this.cache.art.set(lang + '|' + norm(art.title), art);
    while (this.cache.art.size > 30) this.cache.art.delete(this.cache.art.keys().next().value);
    return art;
  },

  // Everything that helps picture the target: summary, visible categories, redirects (aliases) and what its intro links to.
  async targetInfo(lang, title){
    const key = lang + '|' + norm(title);
    if (this.cache.info.has(key)) return this.cache.info.get(key);
    const [sum, meta, lead] = await Promise.all([
      this.summary(lang, title),
      this.json(this.url(lang, {action: 'query', redirects: 1, titles: title, prop: 'categories|redirects', clshow: '!hidden', cllimit: 30, rdlimit: 'max', rdnamespace: 0})).catch(() => null),
      this.json(this.url(lang, {action: 'parse', redirects: 1, prop: 'text', section: 0, disableeditsection: 1, page: title})).catch(() => null)
    ]);
    const info = {...sum};
    const page = meta ? Object.values(meta.query?.pages || {})[0] || {} : {};
    if (page.missing !== undefined && !lead?.parse) info.missing = true;
    info.cats = (page.categories || []).map(c => c.title.replace(/^[^:]+:/, '')).filter(c => !CAT_NOISE.test(c)).slice(0, 6);
    info.aliases = [...new Set([sum.title, title, page.title, lead?.parse?.title, ...(page.redirects || []).map(r => r.title)].filter(Boolean))];
    info.related = []; info.leadLinks = [];
    if (lead?.parse){
      const ns = await this.namespaces(lang);
      const re = linkRegex(lang);
      const doc = new DOMParser().parseFromString(lead.parse.text['*'], 'text/html');
      doc.querySelectorAll('.infobox,.navbox,.sidebar,.hatnote,table,figure,.thumb,sup,style').forEach(e => e.remove());
      const seen = new Set();
      for (const a of doc.querySelectorAll('p a[href], li a[href]')){
        const t = hrefTitle(a.getAttribute('href'), re);
        if (!t || !isArticleTitle(t, ns) || seen.has(norm(t))) continue;
        seen.add(norm(t)); info.leadLinks.push(norm(t));
        if (info.related.length < 10 && a.closest('p')) info.related.push(a.textContent.trim() || t);
      }
    }
    if (!info.missing) this.cache.info.set(key, info);
    return info;
  },

  // Titles in one language → titles in another, through Wikipedia's language links. Missing ones map to null.
  async translate(fromLang, titles, toLang){
    const out = new Map();
    if (fromLang === toLang){ titles.forEach(t => out.set(t, t)); return out; }
    const k = t => `${fromLang}>${toLang}|${t}`;
    const need = [...new Set(titles.filter(t => !this.cache.tr.has(k(t))))];
    for (let i = 0; i < need.length; i += 50){
      const chunk = need.slice(i, i + 50);
      try{
        const d = await this.json(this.url(fromLang, {action: 'query', prop: 'langlinks', lllang: toLang, lllimit: 'max', redirects: 1, titles: chunk.join('|')}));
        const fwd = new Map((d.query?.normalized || []).map(n => [n.from, n.to]));
        const red = new Map((d.query?.redirects || []).map(r => [r.from, r.to]));
        const by = new Map(Object.values(d.query?.pages || {}).map(p => [p.title, p.langlinks?.[0]?.['*'] || null]));
        chunk.forEach(t => { let f = fwd.get(t) || t; f = red.get(f) || f; this.cache.tr.set(k(t), by.has(f) ? by.get(f) : null); });
      }catch{ /* not cached, so we try again next time */ }
    }
    titles.forEach(t => out.set(t, this.cache.tr.has(k(t)) ? this.cache.tr.get(k(t)) : null));
    return out;
  },

  async catMembers(lang, cat, sub){
    const name = String(cat).replace(/^\s*[^:]{3,20}:\s*/, m => /^\s*(categ|catég|kateg)/i.test(m) ? '' : m).trim();
    const key = `${lang}|${norm(name)}|${sub ? 1 : 0}`;
    if (this.cache.cat.has(key)) return this.cache.cat.get(key);
    const get = async (title, type) => {
      const d = await this.json(this.url(lang, {action: 'query', list: 'categorymembers', cmtitle: 'Category:' + title, cmnamespace: type === 'page' ? 0 : 14, cmtype: type, cmlimit: 500}));
      return (d.query?.categorymembers || []).map(m => m.title);
    };
    let pages = await get(name, 'page');
    if (sub){
      const subs = (await get(name, 'subcat').catch(() => [])).slice(0, 12);
      for (const s of subs){ try{ pages = pages.concat(await get(s.replace(/^[^:]+:/, ''), 'page')); }catch{} }
    }
    pages = [...new Set(pages)].filter(t => !/^(list|lista|liste|lijst|listan) /i.test(t));
    this.cache.cat.set(key, pages);
    return pages;
  },

  // Pages that link to a title (including through redirects). Capped so huge pages stay cheap.
  async backlinks(lang, title, cap = 3000){
    const key = lang + '|' + norm(title);
    if (this.cache.back.has(key)) return this.cache.back.get(key);
    const job = (async () => {
      const set = new Set(); let cont = {}; let truncated = false;
      for (let i = 0; i < 8; i++){
        const d = await this.json(this.url(lang, {action: 'query', list: 'backlinks', bltitle: title, blnamespace: 0, bllimit: 'max', blredirect: 1, ...cont}));
        for (const b of d.query?.backlinks || []){
          set.add(norm(b.title));
          for (const r of b.redirlinks || []) set.add(norm(r.title));
        }
        if (!d.continue) break;
        cont = d.continue;
        if (set.size >= cap || i === 7){ truncated = true; break; }
      }
      return {set, truncated};
    })();
    this.cache.back.set(key, job);
    job.catch(() => this.cache.back.delete(key));
    return job;
  },

  async mostRead(lang){
    if (this.cache.feed.has(lang)) return this.cache.feed.get(lang);
    let list = [];
    for (let back = 0; back < 3 && !list.length; back++){
      const d = new Date(Date.now() - back * 864e5);
      const ymd = `${d.getUTCFullYear()}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${String(d.getUTCDate()).padStart(2, '0')}`;
      try{
        const j = await this.json(`https://${lang}.wikipedia.org/api/rest_v1/feed/featured/${ymd}`, {retries: 0, timeout: 9000});
        list = (j.mostread?.articles || [])
          .map(a => String(a.titles?.normalized || a.normalizedtitle || a.title || '').replace(/_/g, ' '))
          .filter(t => t && !t.includes(':') && !/^(main page|pagina principale|accueil|wikipédia:accueil|hauptseite|página principal|portada|strona główna|huvudsida)/i.test(t) && !/^(deaths in|list of|morti nel|décès en|nekrolog)/i.test(t));
      }catch{}
    }
    if (!list.length) throw new Error('Trending pages are not available for this Wikipedia right now.');
    this.cache.feed.set(lang, list);
    return list;
  }
};

/* ---------- Links and namespaces ---------- */
function linkRegex(lang){
  const l = String(lang).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp(`^(?:(?:https?:)?//${l}\\.(?:m\\.)?wikipedia\\.org)?/wiki/([^#?]+)|^\\./([^#?]+)`, 'i');
}
function hrefTitle(href, re){
  const m = String(href || '').match(re);
  if (!m) return '';
  const raw = m[1] || m[2];
  try{ return decodeURIComponent(raw).replace(/_/g, ' '); }catch{ return raw.replace(/_/g, ' '); }
}
function isArticleTitle(t, ns){
  if (!t) return false;
  const i = t.indexOf(':');
  if (i > 0){
    const pre = t.slice(0, i).trim().toLowerCase();
    if (ns ? ns.has(pre) : FALLBACK_NS.test(pre + ':')) return false;
  }
  return true;
}

/* ---------- Cleaning the article HTML ---------- */
const ALWAYS_REMOVE = '.portal,.portalbox,.portal-bar,.portalborder,.noprint.portal,.box-Portal,.side-box,.sistersitebox,.sister-project,.sisterproject,' +
  '.ambox,.ombox,.tmbox,.cmbox,.metadata.plainlinks:not(.infobox):not(.navbox),.mw-references-wrap,.reflist,ol.references,.references-small,.authority-control,' +
  '.toc,#toc,.navbar,.mw-empty-elt,.shortdescription,link,meta,.mw-editsection,#coordinates,.navigation-not-searchable.hatnote-portal';
const NAV_REMOVE = '.navbox,.navbox-styles,.vertical-navbox,.sidebar,.navbox-inner,[role="navigation"]:not(.hatnote)';
function isHeading(el){ return /^H[1-6]$/.test(el.tagName) || el.classList.contains('mw-heading'); }
function headingLevel(el){ const h = /^H[1-6]$/.test(el.tagName) ? el : el.querySelector('h1,h2,h3,h4,h5,h6'); return h ? +h.tagName[1] : 9; }

// Returns the cleaned HTML plus the list of article links that count as moves.
function cleanBody(html, opts = {}){
  const lang = opts.lang || (typeof R !== 'undefined' && R ? R.lang : SET.lang);
  const navboxes = opts.navboxes ?? SET.navboxes;
  const aliases = opts.aliases || new Set();
  const hubs = opts.hubs || null;
  const ns = opts.ns || null;
  const highlight = opts.highlight !== false;
  const self = norm(opts.self ?? '');
  const re = linkRegex(lang);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let root = doc.querySelector('.mw-parser-output');
  if (!root){ root = doc.createElement('div'); root.className = 'mw-parser-output'; root.append(...doc.body.childNodes); doc.body.append(root); }

  root.querySelectorAll(ALWAYS_REMOVE).forEach(e => e.remove());
  if (!navboxes) root.querySelectorAll(NAV_REMOVE).forEach(e => e.remove());
  // TemplateStyles stay (they are scoped to .mw-parser-output). Scripts and embeds never.
  root.querySelectorAll('script,noscript,iframe,object,embed,audio,video,source,form,input,button:not(.wr-toggle)').forEach(e => e.remove());
  root.querySelectorAll('*').forEach(el => { for (const a of [...el.attributes]) if (/^on/i.test(a.name)) el.removeAttribute(a.name); });

  const links = []; const linkSet = new Set();
  let hasTarget = false, blocked = 0;
  root.querySelectorAll('a').forEach(a => {
    let title = hrefTitle(a.getAttribute('href'), re);
    if (title && norm(title) === self) title = '';   // anchors back into the same page are not moves
    const isFile = a.classList.contains('mw-file-description') || a.classList.contains('image') || a.querySelector('img');
    const ok = title && isArticleTitle(title, ns) && !a.classList.contains('new') && !isFile;
    if (ok && hubs && hubs.has(norm(title)) && !aliases.has(norm(title))){
      const s = doc.createElement('span');
      s.className = 'blocked'; s.title = 'Hub page, blocked by No shortcuts';
      s.append(...a.childNodes); a.replaceWith(s); blocked++;
      return;
    }
    if (ok){
      a.className = 'ok';
      a.dataset.title = title;
      a.setAttribute('href', '#');
      a.setAttribute('role', 'link');
      a.removeAttribute('title');
      for (const at of ['rel', 'target', 'style', 'id']) a.removeAttribute(at);
      if (aliases.has(norm(title))){ hasTarget = true; if (highlight) a.classList.add('hit'); }
      if (!linkSet.has(norm(title))){ linkSet.add(norm(title)); links.push(title); }
    } else {
      const s = doc.createElement('span');
      s.className = 'dead';
      s.append(...a.childNodes);
      a.replaceWith(s);
    }
  });

  // Images: protocol-relative URLs, lazy loading, no srcset.
  root.querySelectorAll('img').forEach(i => {
    const src = i.getAttribute('src') || '';
    if (src.startsWith('//')) i.setAttribute('src', 'https:' + src);
    else if (src.startsWith('/')) i.setAttribute('src', `https://${lang}.wikipedia.org${src}`);
    i.removeAttribute('srcset');
    i.setAttribute('loading', 'lazy');
    i.setAttribute('decoding', 'async');
  });
  root.querySelectorAll('span.lazy-image-placeholder').forEach(s => {
    const img = doc.createElement('img'); img.src = 'https:' + (s.dataset.src || ''); img.width = +s.dataset.width || 0; s.replaceWith(img);
  });

  // Show/hide boxes (MediaWiki makes these with its own JavaScript, so they need ours).
  root.querySelectorAll('.mw-collapsible-toggle,.collapseButton,.NavToggle').forEach(e => e.remove());
  root.querySelectorAll('.mw-collapsible, table.collapsible').forEach(box => {
    box.classList.add('mw-collapsible');
    const startCollapsed = box.matches('.mw-collapsed,.autocollapse,.collapsed') || (box.closest('.navbox') && !box.parentElement?.closest('.mw-collapsible, table.collapsible'));
    const btn = doc.createElement('button');
    btn.type = 'button'; btn.className = 'wr-toggle';
    if (box.tagName === 'TABLE'){
      const cap = box.querySelector(':scope > caption');
      const firstRow = box.querySelector(':scope > tbody > tr, :scope > thead > tr, :scope > tr');
      if (cap){ cap.append(btn); }
      else if (firstRow){ firstRow.classList.add('wr-keep'); (firstRow.lastElementChild || firstRow).append(btn); }
      if (box.querySelector(':scope > thead')) box.querySelectorAll(':scope > thead > tr').forEach(r => r.classList.add('wr-keep'));
    } else {
      let content = box.querySelector(':scope > .mw-collapsible-content');
      if (!content){
        content = doc.createElement('div'); content.className = 'mw-collapsible-content';
        content.append(...box.childNodes); box.append(content);
      }
      box.insertBefore(btn, content);
    }
    if (startCollapsed) box.classList.add('wr-collapsed');
    btn.textContent = startCollapsed ? 'show' : 'hide';
  });
  root.querySelectorAll('.NavFrame').forEach(f => {
    const head = f.querySelector(':scope > .NavHead');
    if (!head) return;
    const btn = doc.createElement('button'); btn.type = 'button'; btn.className = 'wr-toggle'; btn.textContent = 'show';
    head.prepend(btn); f.classList.add('wr-collapsed');
  });

  // Wide tables scroll inside their own box (infoboxes keep their float).
  root.querySelectorAll('table').forEach(t => {
    if (t.matches('.infobox') || t.closest('.infobox, .navbox, .tablewrap') || t.parentElement?.closest('table')) return;
    const w = doc.createElement('div'); w.className = 'tablewrap';
    t.replaceWith(w); w.append(t);
  });
  root.querySelectorAll('table:not(.wikitable):not(.infobox)').forEach(t => {
    if (t.getAttribute('border') === '1' || t.matches('.sortable')) t.classList.add('wikitable');
  });

  // Fixed pixel widths on wrappers break phones; let them shrink.
  root.querySelectorAll('[style*="width"]').forEach(e => {
    if (e.tagName === 'IMG') return;
    if (/width\s*:\s*\d{3,}px/i.test(e.getAttribute('style'))) e.style.maxWidth = '100%';
  });

  // Headings whose section is now empty (References, External links with nothing left…)
  const kids = [...root.children];
  kids.forEach((el, i) => {
    if (!isHeading(el)) return;
    const lvl = headingLevel(el);
    let hasContent = false;
    for (let j = i + 1; j < kids.length; j++){
      const k = kids[j];
      if (isHeading(k) && headingLevel(k) <= lvl) break;
      if (!k.isConnected) continue;
      if (isHeading(k)){ hasContent = true; break; }
      if (k.tagName === 'STYLE') continue;
      if (k.textContent.trim() || k.querySelector('img')){ hasContent = true; break; }
    }
    if (!hasContent) el.remove();
  });

  return {html: root.outerHTML, moves: links.length, links, linkSet, hasTarget, blocked};
}

// A table wider than the screen gets squeezed to one word per line. Let it be as wide as its content needs
// (up to about four screens) and scroll sideways inside its box instead.
function fitTables(scope){
  scope.querySelectorAll('.tablewrap').forEach(w => {
    const t = w.firstElementChild;
    if (!t || t.scrollWidth <= w.clientWidth + 1) return;
    t.style.width = 'max-content';
    const natural = t.offsetWidth;
    t.style.width = Math.min(natural, Math.max(w.clientWidth * 4, 1000)) + 'px';
  });
}

/* ---------- Pools and pairs ---------- */
const POOL_CACHE = new Map();
async function poolTitles(catId, lang){
  const key = catId + '|' + lang;
  if (POOL_CACHE.has(key)) return POOL_CACHE.get(key);
  let list;
  if (catId === 'trending') list = await W.mostRead(lang);
  else {
    const cat = findCat(catId);
    if (!cat || cat.special) throw new Error('That category no longer exists.');
    const def = cat.custom ? cat.def : {kind: 'list', lang: 'en', items: cat.items};
    if (def.kind === 'wikicat'){
      const members = await W.catMembers(def.lang, def.cat, def.sub);
      if (!members.length) throw new Error(`The category “${def.cat}” is empty or does not exist on ${langName(def.lang)} Wikipedia.`);
      if (def.lang === lang) list = members;
      else {
        const sample = shuffle(members).slice(0, 100);
        const tr = await W.translate(def.lang, sample, lang);
        list = sample.map(t => tr.get(t)).filter(Boolean);
      }
    } else {
      const items = (def.items || []).filter(Boolean);
      if ((def.lang || 'en') === lang) list = items.slice();
      else {
        const tr = await W.translate(def.lang || 'en', items, lang);
        list = items.map(t => tr.get(t)).filter(Boolean);
      }
    }
  }
  if (!list.length) throw new Error(`No articles from this category exist on ${langName(lang)} Wikipedia.`);
  POOL_CACHE.set(key, list);
  return list;
}
function forgetPool(catId){ for (const k of [...POOL_CACHE.keys()]) if (k.startsWith(catId + '|')) POOL_CACHE.delete(k); }

async function drawTitle(catId, lang, rnd = Math.random, exclude = new Set()){
  if (catId === 'random'){
    for (let i = 0; i < 4; i++){ const t = await W.random(lang); if (!exclude.has(norm(t))) return t; }
    throw new Error('Could not find a random article. Try again.');
  }
  const options = (await poolTitles(catId, lang)).filter(t => !exclude.has(norm(t)));
  if (!options.length) throw new Error('This category needs at least two articles.');
  return pick(options, rnd);
}

// src.kind: random | cats | trivia | silly | words | fixed
async function makePair(src, lang, rnd = Math.random){
  const kind = src.kind || 'random';
  let fact = '', label = '', comboId = null;
  const pickTitles = async () => {
    if (kind === 'trivia' || kind === 'silly'){
      const c = COMBOS.find(c => c.id === src.combo) || pick(COMBOS.filter(c => c.kind === kind), rnd);
      const tr = await W.translate('en', [c.s, c.t], lang);
      if (!tr.get(c.s) || !tr.get(c.t)) throw new Error(`“${c.s} → ${c.t}” is not available on ${langName(lang)} Wikipedia. Pick another one or switch language.`);
      fact = c.fact || ''; label = c.quip || ''; comboId = c.id;
      return [tr.get(c.s), tr.get(c.t)];
    }
    if (kind === 'words') return Promise.all([src.s ? W.search(lang, src.s) : W.random(lang), src.t ? W.search(lang, src.t) : W.random(lang)]);
    if (kind === 'fixed') return [src.s, src.t];
    const from = kind === 'cats' ? src.from : 'random', to = kind === 'cats' ? src.to : 'random';
    const s = await drawTitle(from, lang, rnd);
    const t = await drawTitle(to, lang, rnd, new Set([norm(s)]));
    return [s, t];
  };
  const redrawable = kind === 'random' || kind === 'cats';
  for (let attempt = 0; attempt < (redrawable ? 3 : 1); attempt++){
    const [s, t] = await pickTitles();
    if (norm(s) === norm(t)){
      if (redrawable) continue;
      throw new Error('Start and target are the same article. Pick something different.');
    }
    const [start, target] = await Promise.all([W.summary(lang, s), W.targetInfo(lang, t)]);
    if (start.missing || target.missing){
      if (redrawable) continue;
      throw new Error(`“${start.missing ? s : t}” does not exist on ${langName(lang)} Wikipedia.`);
    }
    if (norm(start.title) === norm(target.title)){ if (redrawable) continue; throw new Error('Start and target are the same article.'); }
    return {lang, start, target, fact, label, comboId, kind};
  }
  throw new Error('Could not put a pair together. Try again.');
}

/* ---------- Daily race ---------- */
const DAILY_EPOCH = '2026-10-24';
const DAILY_CACHE = new Map();
const dailyNo = (date = todayStr()) => daysBetween(DAILY_EPOCH, date) + 1;
async function dailyPair(lang, date = todayStr()){
  const key = date + '|' + lang;
  if (DAILY_CACHE.has(key)) return DAILY_CACHE.get(key);
  const rnd = rngFrom('wiki-race-daily|' + date);
  for (let i = 0; i < 14; i++){
    const [a, b] = shuffle(BUILTIN_CATS, rnd).slice(0, 2);
    const s = pick(a.items, rnd), t = pick(b.items, rnd);
    const tr = await W.translate('en', [s, t], lang);
    if (tr.get(s) && tr.get(t) && norm(tr.get(s)) !== norm(tr.get(t))){
      const p = {s: tr.get(s), t: tr.get(t), from: a, to: b, date};
      DAILY_CACHE.set(key, p);
      return p;
    }
  }
  throw new Error('No daily race is available for this language today.');
}

async function hubSet(lang){
  const tr = await W.translate('en', HUBS, lang);
  return new Set([...tr.values()].filter(Boolean).map(norm));
}

/* =====================================================================
   Race engine
   ===================================================================== */
let R = null;      // race in progress (or the one that just ended)
let LAST = null;   // summary of the last finished race

function cfgFromSetup(){ return {mode: SETUP.mode, timeLimit: SETUP.timeLimit, twists: SETUP.twists.slice(), navboxes: SET.navboxes}; }

function maskTitle(text, t){
  const words = [...new Set(String(t.title || '').split(/[\s()[\],:;.\-–'’"!?]+/).filter(w => w.length >= 3))];
  if (!words.length || !text) return text || '';
  const re = new RegExp(`(?<![\\p{L}\\p{N}])(?:${words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})\\p{L}{0,3}(?![\\p{L}\\p{N}])`, 'giu');
  return String(text).replace(re, m => '▒'.repeat(Math.min(Math.max(m.length, 3), 8)));
}

function stopRace(){
  if (!R) return;
  clearInterval(R.tick);
  clearChaos();
  R.ended = true;
}

async function startRace(pair, cfg, extra = {}){
  stopRace();
  closeModal(); closeSheet(); FIND.close(); LP.hide();
  TOASTS.length = 0;
  const tw = new Set((cfg.twists || []).filter(t => TWISTS[t]));
  R = {
    id: Date.now(), lang: pair.lang, pair, start: pair.start, target: pair.target,
    cfg: {mode: MODES[cfg.mode] ? cfg.mode : 'classic', timeLimit: TIME_LIMITS.includes(+cfg.timeLimit) ? +cfg.timeLimit : 150, twists: tw, navboxes: !!cfg.navboxes},
    extra, clicks: 0, path: [], kinds: [], journey: [], visits: new Map(), backs: 0, hints: 0,
    t0: 0, elapsed: 0, tick: null, ended: false, busy: false, status: 'racing', why: '',
    aliases: new Set((pair.target.aliases || [pair.target.title]).map(norm)),
    leadLinks: new Set(pair.target.leadLinks || []), hubs: null, back: null, ns: null,
    temp: null, chaosIn: 2 + Math.floor(Math.random() * 2), cx: new Set(), timers: [],
    links: [], linkSet: new Set(), hasTarget: false, startLinks: null, peeked: false, giveupArmed: 0
  };
  const race = R;
  document.body.classList.add('racing');
  $('app').innerHTML = `<div class="game"><main id="page" aria-live="polite"><p class="msg">${esc(pick(LOAD_LINES))}</p></main><aside class="side" id="side" aria-label="Target and path"></aside></div>`;
  setHud(true);
  renderSide();
  window.scrollTo(0, 0);
  try{ history.pushState({wr: 1}, ''); }catch{}
  race.ns = await W.namespaces(race.lang);
  if (tw.has('nohubs')){
    try{ race.hubs = await hubSet(race.lang); }catch{ race.hubs = new Set(); }
    for (const a of race.aliases) race.hubs.delete(a);
    race.hubs.delete(norm(race.start.title));
  }
  if (tw.has('hotcold')) loadBacklinks(race);
  if (R !== race || race.ended) return;
  const ok = await go(race.start.title, {count: false, kind: 'start'});
  if (!ok && R === race && !race.path.length){
    $('page').innerHTML = `<div class="hero-err"><p>The start article could not be opened. Check your connection.</p><div class="row"><button class="go" data-act="retrystart">Try again</button><button data-act="home">Home</button></div></div>`;
  }
}

function loadBacklinks(race){
  W.backlinks(race.lang, race.target.title)
    .then(b => { race.back = b; if (R === race && !race.ended) updateTemp(true); })
    .catch(() => {});
}

async function go(title, {count = true, kind = 'move', quiet = false} = {}){
  const race = R;
  if (!race || race.ended || race.busy) return false;
  race.busy = true; setLoading(true);
  try{
    const art = await W.article(race.lang, title);
    if (R !== race || race.ended) return false;
    const nt = norm(art.title);
    if (kind === 'move' && race.hubs && race.hubs.has(nt) && !race.aliases.has(nt)){
      toast('🚧 Sneaky! That link leads to a hub page. Pick another one.'); SND.bad();
      return false;
    }
    if (count) race.clicks++;
    if (kind === 'back'){ race.path.pop(); race.kinds.pop(); }
    else { race.path.push(art.title); race.kinds.push(kind); }
    race.journey.push({t: art.title, k: kind});
    race.visits.set(nt, (race.visits.get(nt) || 0) + 1);
    if (!race.t0) startClock();
    if (race.aliases.has(nt)){ finish('won'); return true; }
    if (race.cfg.mode === 'six' && race.clicks >= 6){ finish('failed', 'clicks'); return true; }
    const tw = race.cfg.twists;
    const c = cleanBody(art.html, {lang: race.lang, navboxes: race.cfg.navboxes, aliases: race.aliases, self: art.title, ns: race.ns, hubs: race.hubs, highlight: !tw.has('mystery') && !tw.has('invisible')});
    race.links = c.links; race.linkSet = c.linkSet; race.hasTarget = c.hasTarget; race.current = art.title;
    if (!race.startLinks) race.startLinks = c.links.slice();
    renderArticle(art, c);
    afterArrive(art, kind);
    return true;
  }catch(e){
    if (R === race && !quiet) toast(e.message);
    return false;
  }finally{
    race.busy = false; setLoading(false);
  }
}

function renderArticle(art, c){
  const tw = R.cfg.twists;
  let note = '';
  if (c.hasTarget) note = tw.has('mystery') ? '🎯 The mystery article is linked somewhere on this page.' : tw.has('invisible') ? '🎯 The target is linked on this page. Somewhere.' : '🎯 The target is linked on this page.';
  $('page').innerHTML = `<div class="ahead"><h2 class="atitle">${esc(art.title)}</h2>
      <p class="asub">Step ${R.path.length - 1} · ${plural(R.clicks, 'click')}${c.blocked ? ` · 🚧 ${c.blocked} blocked` : ''}${note ? ` · <b class="hitnote">${note}</b>` : ''}</p></div>
    <div class="paper${tw.has('invisible') ? ' invisible' : ''}">${c.html}</div>
    <p class="attrib">Article text from <a href="${esc(wikiUrl(R.lang, art.title))}" target="_blank" rel="noopener">Wikipedia</a>, available under CC BY-SA 4.0.</p>`;
  fitTables($('page'));
}

function afterArrive(art, kind){
  updateHud(); renderSide();
  FIND.close(); LP.hide();
  window.scrollTo(0, 0);
  const nt = norm(art.title);
  if (R.cfg.twists.has('hotcold')) updateTemp(kind === 'start');
  if (kind !== 'back' && kind !== 'start'){
    const v = R.visits.get(nt);
    if (v === 2) toast('👀 Déjà vu! You have been here before.');
    else if (v >= 3) toast('🔁 Going in circles?');
    if (EASTER[nt]) toast(EASTER[nt], 3600);
  }
  if (R.cfg.twists.has('chaos') && kind === 'move') maybeChaos();
  if (R.extra.room) MP.progress();
}

function back(){
  if (!R || R.ended || R.busy) return;
  if (R.cfg.twists.has('noback')){ toast('🚫 No going back in this race.'); SND.bad(); return; }
  if (R.path.length < 2) return;
  closeSheet();
  const race = R;
  race.backs++;
  go(race.path[race.path.length - 2], {count: true, kind: 'back'}).then(ok => { if (!ok) race.backs = Math.max(0, race.backs - 1); });
}

/* ---------- Clock ---------- */
function startClock(){
  R.t0 = performance.now();
  clearInterval(R.tick);
  R.tick = setInterval(tick, 250);
  tick();
}
function tick(){
  if (!R || R.ended || !R.t0) return;
  const ms = performance.now() - R.t0;
  if (R.cfg.mode === 'time'){
    const left = R.cfg.timeLimit * 1000 - ms;
    $('time').textContent = fmtTime(Math.max(0, left) + 999);
    $('timebox').classList.toggle('low', left < 15000);
    if (left <= 0) finish('failed', 'time');
  } else $('time').textContent = fmtTime(ms);
}

/* ---------- Ending ---------- */
function finish(status, why = ''){
  if (!R || R.ended) return;
  const race = R;
  race.elapsed = race.t0 ? performance.now() - race.t0 : 0;
  race.ended = true; race.status = status; race.why = why;
  TOASTS.length = 0;   // drop race messages still waiting; achievements come next
  clearInterval(race.tick); clearChaos(); closeSheet(); FIND.close(); LP.hide();
  document.body.classList.remove('racing');
  setHud(false);
  const g = gameSummary(race);
  LAST = g;
  const rec = recordGame(g);
  g.prevBest = rec.prevBest;
  if (g.won){ SND.win(); confetti(); } else SND.fail();
  if (race.extra.room){ MP.finished(g, rec.unlocked); return; }
  renderResults(g, rec.unlocked);
}
function gameSummary(r){
  return {
    lang: r.lang, start: r.start, target: r.target, startTitle: r.start.title, targetTitle: r.target.title, pair: r.pair,
    mode: r.cfg.mode, timeLimit: r.cfg.timeLimit, twists: [...r.cfg.twists], navboxes: r.cfg.navboxes,
    won: r.status === 'won', status: r.status, why: r.why, clicks: r.clicks, ms: Math.round(r.elapsed), backs: r.backs, hints: r.hints,
    path: r.path.slice(), kinds: r.kinds.slice(), maxVisits: Math.max(0, ...r.visits.values()), visited: [...r.visits.keys()],
    startLinks: r.startLinks || [], aliases: [...r.aliases], fact: r.pair.fact || '', label: r.pair.label || '', comboId: r.pair.comboId || null,
    daily: r.extra.daily || null, dailyRepeat: !!r.extra.dailyRepeat, challenge: r.extra.challenge || null, room: r.extra.room || null, round: r.extra.round || 0,
    when: Date.now()
  };
}
function giveUp(btn){
  if (!R || R.ended) return;
  if (Date.now() - R.giveupArmed < 3000){ finish('gaveup'); return; }
  R.giveupArmed = Date.now();
  $$('[data-act="giveup"]').forEach(b => flash(b, 'Sure? Tap again'));
}

/* ---------- Hints, peeking ---------- */
async function hint(){
  if (!R || R.ended || R.busy) return;
  if (R.cfg.mode === 'six'){ toast('🔮 The oracle stays quiet in Six degrees.'); return; }
  const race = R, tw = race.cfg.twists;
  closeSheet();
  race.hints++; race.clicks++; updateHud(); renderSide(); SND.pop();
  $$('.paper a.oracle').forEach(a => a.classList.remove('oracle'));
  if (race.hasTarget){
    toast('🔮 ' + (tw.has('invisible') || tw.has('mystery') ? 'The target is linked somewhere on this very page.' : 'The target is right here. Look for the green link.'), 5000);
    return;
  }
  toast('🔮 Consulting the oracle…', 1400);
  let b;
  try{ b = await W.backlinks(race.lang, race.target.title); }
  catch{
    if (R === race && !race.ended){ race.clicks--; race.hints--; updateHud(); renderSide(); toast('🔮 The oracle could not reach Wikipedia. Your click was refunded.'); }
    return;
  }
  if (R !== race || race.ended) return;
  race.back = b;
  const via = race.links.find(t => b.set.has(norm(t)) && !(race.hubs && race.hubs.has(norm(t))));
  if (via){
    const a = $$('.paper a.ok').find(x => norm(x.dataset.title) === norm(via));
    if (a && !tw.has('invisible')){
      a.classList.add('oracle'); expandAncestors(a);
      a.scrollIntoView({block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth'});
    }
    toast(`🔮 Try “${(a && a.textContent.trim()) || via}”. That page links straight to the target.`, 5600);
  } else {
    let cats = (race.target.cats || []).slice(0, 2);
    if (tw.has('mystery')) cats = cats.map(c => maskTitle(c, race.target));
    toast(`🔮 Nothing here links straight to the target${b.truncated ? ' as far as I can see' : ''}. Head for something broader${cats.length ? `, maybe around ${cats.join(' or ')}` : ''}.`, 6000);
  }
  if (tw.has('hotcold')) updateTemp(true);
}
function peek(){
  if (!R || R.ended || R.peeked) return;
  R.peeked = true; R.clicks++; updateHud(); setHud(true); renderSide();
  toast('👁️ Peeked. That cost you a click.');
}

/* ---------- Hot & cold ---------- */
function tempLevel(){
  if (!R) return null;
  if (R.hasTarget) return 3;
  if (R.back && R.links.some(t => R.back.set.has(norm(t)))) return 2;
  if (R.links.some(t => R.leadLinks.has(norm(t)))) return 1;
  return 0;
}
function updateTemp(silent){
  if (!R || !R.cfg.twists.has('hotcold')) return;
  const lvl = tempLevel(), prev = R.temp;
  R.temp = lvl;
  const el = $('temp');
  el.hidden = false;
  el.className = 'temp l' + lvl;
  el.innerHTML = `${TEMPS[lvl].e}<span class="tl"> ${TEMPS[lvl].n}</span>`;
  if (!silent && prev != null && lvl !== prev){
    el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 700);
    if (lvl > prev){ toast(`${TEMPS[lvl].e} Warmer! ${TEMPS[lvl].d}`, 2600); SND.warm(); }
    else { toast(`${TEMPS[lvl].e} Colder…`, 1800); SND.cold(); }
  }
  $$('.thermo-slot').forEach(s => { s.innerHTML = thermoHTML(); });
}
function thermoHTML(){
  const l = R ? R.temp : null;
  return `<h4>🌡️ Hot &amp; cold</h4><div class="thermo"><div class="bar5">${[0, 1, 2, 3].map(i => `<span class="${l != null && i <= l ? 'on l' + l : ''}"></span>`).join('')}</div>
    <p>${l == null ? 'Reading the thermometer…' : `${TEMPS[l].e} <b>${TEMPS[l].n}.</b> ${TEMPS[l].d}`}</p></div>`;
}

/* ---------- Chaos ---------- */
function maybeChaos(){
  if (--R.chaosIn > 0) return;
  R.chaosIn = 2 + Math.floor(Math.random() * 3);
  let pool = CHAOS.filter(c => !(c.motion && reduceMotion()));
  if (R.cfg.mode === 'six') pool = pool.filter(c => c.id !== 'banana');
  if (R.cfg.twists.has('invisible')) pool = pool.filter(c => c.id !== 'blackout');
  if (R.hasTarget) pool = pool.filter(c => c.id !== 'teleport');
  pool = pool.filter(c => !(c.cls && R.cx.has(c.cls)));
  const ev = pick(pool), race = R;
  race.timers.push(setTimeout(() => runChaos(ev, race), 700));
}
function runChaos(ev, race){
  if (R !== race || race.ended) return;
  SND.chaos();
  toast(`${ev.e} ${ev.msg}`, 3200);
  if (ev.cls){
    document.body.classList.add(ev.cls); race.cx.add(ev.cls);
    race.timers.push(setTimeout(() => { document.body.classList.remove(ev.cls); race.cx.delete(ev.cls); }, ev.ms));
    return;
  }
  if (ev.id === 'banana'){ race.clicks++; updateHud(); renderSide(); return; }
  if (ev.id === 'clover'){ race.clicks = Math.max(0, race.clicks - 1); updateHud(); renderSide(); return; }
  if (ev.id === 'shuffle'){
    const root = $('page')?.querySelector('.mw-parser-output');
    if (!root) return;
    const ps = [...root.children].filter(e => e.tagName === 'P' && e.textContent.trim());
    const marks = ps.map(p => { const m = document.createComment('p'); p.replaceWith(m); return m; });
    shuffle(ps).forEach((p, i) => marks[i].replaceWith(p));
    return;
  }
  if (ev.id === 'teleport'){
    const opts = shuffle(race.links.filter(t => !race.aliases.has(norm(t)) && !(race.hubs && race.hubs.has(norm(t))))).slice(0, 4);
    if (!opts.length) return;
    // Try a few links in case one points to a page that no longer exists.
    const jump = async (waits) => {
      if (R !== race || race.ended) return;
      if (race.busy){ if (waits > 0) race.timers.push(setTimeout(() => jump(waits - 1), 700)); return; }
      for (const t of opts){
        if (R !== race || race.ended) return;
        if (await go(t, {count: false, kind: 'teleport', quiet: true})) return;
      }
    };
    race.timers.push(setTimeout(() => jump(4), 1300));
  }
}
function clearChaos(){
  if (!R) return;
  R.timers.forEach(clearTimeout); R.timers = [];
  for (const c of R.cx) document.body.classList.remove(c);
  R.cx.clear();
}

/* ---------- HUD, side panel, sheet ---------- */

  $('tools').hidden = on;
  $('temp').hidden = !(on && R && R.cfg.twists.has('hotcold'));

      <div class="pblock"><h4>Your path · ${plural(R.clicks, 'click')}</h4><ol class="pathlist">${R.path.map((p, i) => `<li${R.kinds[i] === 'teleport' ? ' class="tp"' : ''}>${esc(p)}</li>`).join('')}</ol></div>

function reactionBar(){ return `<div class="rxbar">${REACTIONS.map(e => `<button data-act="emo" data-e="${e}" aria-label="Send ${e}">${e}</button>`).join('')}</div>`; }
function openSheet(){ if (!R || R.ended) return; document.body.classList.add('sheet-open'); }
function closeSheet(){ document.body.classList.remove('sheet-open'); }

function targetCardHTML(t, o = {}){

/* ---------- Find a link on the page ---------- */
const FIND = {
  list: [], i: -1,
  open(){
    if (!R || R.ended) return;
    if (R.cfg.twists.has('invisible')){ toast('👻 Find is switched off with Invisible links.'); return; }
    closeSheet();
    $('findbar').hidden = false; $('findq').value = ''; $('findn').textContent = '';
    $('findq').focus();
  },
  close(){ $('findbar').hidden = true; this.clear(); },
  clear(){ $$('.paper a.fmatch').forEach(a => a.classList.remove('fmatch', 'fcur')); this.list = []; this.i = -1; },
  run(q){
    this.clear();
    const k = fold(q.trim());
    if (k.length < 2){ $('findn').textContent = ''; return; }
    this.list = $$('.paper a.ok').filter(a => fold(a.textContent).includes(k) || fold(a.dataset.title).includes(k));
    this.list.forEach(a => a.classList.add('fmatch'));
    if (this.list.length) this.next(); else $('findn').textContent = 'No links';
  },
  next(){
    if (!this.list.length){ this.run($('findq').value); return; }
    this.list[this.i]?.classList.remove('fcur');
    this.i = (this.i + 1) % this.list.length;
    const a = this.list[this.i];
    a.classList.add('fcur'); expandAncestors(a);
    a.scrollIntoView({block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth'});
    $('findn').textContent = `${this.i + 1} / ${this.list.length}`;
  }
};
function expandAncestors(el){
  let box = el.closest('.wr-collapsed');
  while (box){
    box.classList.remove('wr-collapsed');
    const t = $$('.wr-toggle', box).find(b => b.closest('.mw-collapsible, .NavFrame') === box);
    if (t) t.textContent = 'hide';
    box = box.parentElement?.closest('.wr-collapsed');
  }
  const d = el.closest('details'); if (d) d.open = true;
}

/* ---------- Link previews (computer only) ---------- */
const LP = {
  a: null, timer: null,
  over(a){
    if (this.a === a) return;
    this.hide(); this.a = a;
    this.timer = setTimeout(() => this.show(a), 420);
  },
  async show(a){
    if (!R || R.ended) return;
    const s = await W.summary(R.lang, a.dataset.title);
    if (this.a !== a || !a.isConnected || !s || (!s.extract && !s.desc)) return;
    const el = $('lp');
    el.innerHTML = `${s.img ? `<img src="${esc(s.img)}" alt="">` : ''}<div class="in"><b>${esc(s.title)}</b>${s.desc ? `<i>${esc(s.desc)}</i>` : ''}<p>${esc(s.extract)}</p></div>`;
    el.hidden = false;
    const r = a.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
    let top = r.bottom + 8;
    if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 8);
    el.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    el.style.top = top + 'px';
  },
  hide(){ clearTimeout(this.timer); this.a = null; const el = $('lp'); if (el) el.hidden = true; }
};

/* ---------- Results ---------- */
function rankFor(g){
  if (g.status === 'gaveup') return {e: '🏳️', n: 'Tactical retreat'};
  if (!g.won) return g.why === 'time' ? {e: '⏰', n: 'The clock won this time'} : g.why === 'clicks' ? {e: '🎲', n: 'Out of clicks'} : {e: '🛑', n: 'Round over'};
  const c = g.clicks;
  if (c <= 1) return {e: '🧙', n: 'Wikipedia Wizard'};
  if (c <= 3) return {e: '🏎️', n: 'Speed Reader'};
  if (c <= 6) return {e: '🎯', n: 'Six Degrees Master'};
  if (c <= 10) return {e: '🧭', n: 'Scenic Route Enjoyer'};
  if (c <= 20) return {e: '🎒', n: 'Professional Wanderer'};
  return {e: '📚', n: 'Lost in the Stacks'};
}
function outcomeTitle(g){
  if (g.won) return g.targetTitle;
  if (g.status === 'gaveup') return 'You gave up';
  if (g.why === 'time') return 'Time’s up';
  if (g.why === 'clicks') return 'Out of clicks';
  return 'Round over';
}
function better(a, b, mode){ return mode === 'time' ? a.ms < b.ms : (a.clicks < b.clicks || (a.clicks === b.clicks && a.ms < b.ms)); }

function renderResults(g, unlocked = []){
  window.scrollTo(0, 0);
  const rank = rankFor(g);
  const prev = g.prevBest;
  let bestLine = '';
  if (g.won){
    if (!prev) bestLine = 'Your first finish on this pair.';
    else if (better(g, prev, g.mode)) bestLine = `🏅 New personal best on this pair. Before: ${plural(prev.clicks, 'click')} in ${fmtTime(prev.ms)}.`;
    else bestLine = `Your best on this pair: ${plural(prev.clicks, 'click')} in ${fmtTime(prev.ms)}.`;
  }
  const route = g.path.map((t, i) => `<li class="${i === g.path.length - 1 && g.won ? 'end' : ''}"><span class="th" data-thumb="${esc(t)}">${esc((t[0] || '?').toUpperCase())}</span><span class="no">${i === 0 ? 'Start' : 'Step ' + i}${g.kinds[i] === 'teleport' ? ' 🌀' : ''}</span><span class="st">${esc(t)}</span></li>`).join('');
  const mysteryReveal = !g.won && g.twists.includes('mystery') ? `<p class="res-line">The mystery article was <b>${esc(g.targetTitle)}</b>.</p>` : '';

function challengeHTML(g){

async function loadThumbs(lang){
  for (const el of $$('.route .th[data-thumb]')){
    W.summary(lang, el.dataset.thumb).then(s => {

    });
  }
}
async function computePar(g){
  const el = $('par');
  if (!el) return;
  const sixUrl = g.lang === 'en' ? ` <a href="https://www.sixdegreesofwikipedia.com/?source=${encodeURIComponent(g.startTitle)}&target=${encodeURIComponent(g.targetTitle)}" target="_blank" rel="noopener">See every shortest route ↗</a>` : '';
  try{
    const aliases = new Set(g.aliases);
    const startLinks = g.startLinks || [];
    if (!startLinks.length) throw new Error('no links');
    let par = null, via = null, maybe = false;
    if (startLinks.some(t => aliases.has(norm(t)))) par = 1;
    else {
      const b = await W.backlinks(g.lang, g.targetTitle);
      via = startLinks.find(t => b.set.has(norm(t))) || null;
      par = via ? 2 : 3; maybe = !via && b.truncated;
    }
    if (!el.isConnected) return;
    let text = par === 1 ? '🧮 Shortest route: 1 click. The target was linked on the start page.'
      : par === 2 ? `🧮 Shortest route: 2 clicks, through “${esc(via)}”.`
      : `🧮 There is ${maybe ? 'probably ' : ''}no 2-click route. The shortest one takes 3 clicks or more.`;
    if (g.won && par <= 2){
      if (g.clicks === par){ text += ' You found it. 🧠'; if (unlock('bigbrain')) toast('🧠 Achievement unlocked: Big brain'); }
      else text += ` You took ${g.clicks}.`;
    } else if (g.won && par === 3 && g.clicks === 3) text += ' Your 3 clicks may well be perfect.';
    el.innerHTML = text + sixUrl;
  }catch{ if (el.isConnected) el.innerHTML = '🧮 Could not check the shortest route this time.' + sixUrl; }
}
function shareText(g){
  const head = g.daily ? `Wiki Race Daily #${dailyNo(g.daily)}` : 'Wiki Race';
  const icons = MODES[g.mode].e + g.twists.map(t => TWISTS[t].e).join('');
  const pair = g.twists.includes('mystery') ? `${g.startTitle} → ???` : `${g.startTitle} → ${g.targetTitle}`;
  const steps = g.won ? '🟦'.repeat(Math.min(19, Math.max(0, g.clicks - 1))) + '🎯' : '🟦'.repeat(Math.min(19, g.clicks)) + '❌';
  return `${head} ${icons}\n${pair}\n${g.won ? `${plural(g.clicks, 'click')} · ${fmtTime(g.ms)}` : 'Did not make it'}\n${steps}`;
}
function challengeUrl(g, withScore = true){
  const d = {v: 1, l: g.lang, s: g.startTitle, t: g.targetTitle, m: g.mode, tl: g.timeLimit, w: g.twists, nb: g.navboxes ? 1 : 0, n: SET.name, a: SET.avatar};
  if (withScore && g.won) Object.assign(d, {k: g.clicks, d: Math.round(g.ms / 1000), p: g.path.slice(0, 30)});
  return baseUrl() + '?c=' + b64urlEncode(d);
}

/* =====================================================================
   Stats, achievements, history
   ===================================================================== */
function getStats(){
  return Object.assign({played: 0, won: 0, clicksWon: 0, best: null, fastest: null, langs: [], trails: [], streak: 0, bestStreak: 0, lastDailyWin: null, giveups: 0, rounds: 0}, store.get('stats', {}));
}
function streakNow(){
  const st = getStats();
  if (!st.lastDailyWin) return 0;
  const t = todayStr();
  return st.lastDailyWin === t || st.lastDailyWin === addDays(t, -1) ? st.streak : 0;
}
function unlock(id){
  const a = store.get('ach', {});
  if (a[id] || !ACH.some(x => x.id === id)) return false;
  a[id] = todayStr();
  store.set('ach', a);
  return true;
}
function badgeHTML(a, on, fresh){
  if (!a) return '';
  return `<div class="badge${on ? '' : ' locked'}${fresh ? ' new' : ''}"><span class="em">${a.e}</span><div><b>${esc(a.n)}</b><small>${esc(a.d)}</small></div></div>`;
}
const bestKey = g => `${g.lang}|${g.mode}|${g.navboxes ? 1 : 0}|${norm(g.startTitle)}>${norm(g.targetTitle)}`;

// Saves the race and returns {unlocked, prevBest}.
function recordGame(g){
  const st = getStats();
  st.played++;
  if (g.room) st.rounds++;
  if (g.status === 'gaveup') st.giveups++;
  let prevBest = null;
  if (g.won){
    st.won++; st.clicksWon += g.clicks;
    st.best = st.best == null ? g.clicks : Math.min(st.best, g.clicks);
    st.fastest = st.fastest == null ? g.ms : Math.min(st.fastest, g.ms);
    if (!st.langs.includes(g.lang)) st.langs.push(g.lang);
    if (g.comboId && g.comboId.startsWith('tr-') && !st.trails.includes(g.comboId)) st.trails.push(g.comboId);
    const bests = store.get('best', {});
    const k = bestKey(g);
    prevBest = bests[k] || null;
    if (!prevBest || better(g, prevBest, g.mode)){
      bests[k] = {clicks: g.clicks, ms: g.ms, t: Date.now()};
      const keys = Object.keys(bests);
      if (keys.length > 300) keys.sort((a, b) => bests[a].t - bests[b].t).slice(0, keys.length - 300).forEach(x => delete bests[x]);
      store.set('best', bests);
    }
  }
  if (g.daily && !g.dailyRepeat){
    const days = store.get('daily', {});
    if (!days[g.daily]) days[g.daily] = {won: g.won, c: g.clicks, ms: g.ms, l: g.lang, s: g.startTitle, t: g.targetTitle};
    const ks = Object.keys(days).sort();
    while (ks.length > 60) delete days[ks.shift()];
    store.set('daily', days);
    if (g.won){
      if (st.lastDailyWin === addDays(g.daily, -1)) st.streak++;
      else if (st.lastDailyWin !== g.daily) st.streak = 1;
      st.lastDailyWin = g.daily;
      st.bestStreak = Math.max(st.bestStreak, st.streak);
    }
  }
  store.set('stats', st);
  const hist = store.get('history', []);
  hist.unshift({s: g.startTitle, t: g.targetTitle, l: g.lang, m: g.mode, w: g.twists, c: g.clicks, ms: g.ms, won: g.won, status: g.status, d: g.when, daily: g.daily || null, room: !!g.room});
  store.set('history', hist.slice(0, 40));

  const checks = {
    first: g.won, sniper: g.won && g.clicks === 1, speed: g.won && g.ms < 30000, six: g.won && g.mode === 'six', clock: g.won && g.mode === 'time',
    scenic: g.won && g.clicks >= 25, nouturn: g.won && g.backs === 0 && g.clicks >= 3, detective: g.won && g.twists.includes('mystery'),
    ghost: g.won && g.twists.includes('invisible'), chaos: g.won && g.twists.includes('chaos'), stacked: g.won && g.twists.length >= 3,
    philo: g.visited.some(t => ['philosophy', 'filosofia', 'philosophie', 'filosofie', 'filozofia', 'filosofi'].includes(t)),
    dejavu: g.maxVisits >= 3, polyglot: st.langs.length >= 3, trivia5: st.trails.length >= 5, streak3: st.streak >= 3,
    party: !!g.room, owl: g.won && new Date().getHours() < 5, quitter: g.status === 'gaveup',
    challenger: !!(g.won && g.challenge && g.challenge.k != null && better(g, {clicks: +g.challenge.k, ms: (+g.challenge.d || 0) * 1000}, g.mode))
  };
  const unlocked = Object.keys(checks).filter(id => checks[id] && unlock(id));
  unlocked.forEach(id => { const a = ACH.find(x => x.id === id); toast(`${a.e} Achievement unlocked: ${a.n}`, 2600); });
  return {unlocked, prevBest};
}

async function fillDaily(){
  const el = $('dailyBody'); if (!el) return;
  try{
    const p = await dailyPair(SET.lang);
    if (!$('dailyBody')) return;
    const done = store.get('daily', {})[todayStr()];
    const st = streakNow();
    el.innerHTML = `<p class="dpair"><b>${esc(p.s)}</b> → <b>${esc(p.t)}</b></p>
      <p class="muted">${p.from.e} ${esc(p.from.n)} to ${p.to.e} ${esc(p.to.n)} · classic rules · streak ${st ? '🔥 ' + st : '0'}</p>
      <div class="row">${done
        ? `<span class="pill ok">${done.won ? `✓ ${plural(done.c, 'click')} · ${fmtTime(done.ms)}` : '✗ Not finished'}</span><button data-act="dailyshare">📤 Share</button><button data-act="daily">Play again</button>`
        : `<button class="go" data-act="daily">Play today’s race</button>`}</div>`;
  }catch(e){ if ($('dailyBody')) el.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}
async function startDaily(btn){
  if (btn) flash(btn, 'Loading…');
  try{
    const d = await dailyPair(SET.lang);
    const pair = await makePair({kind: 'fixed', s: d.s, t: d.t}, SET.lang);
    const done = store.get('daily', {})[d.date];
    startRace(pair, {mode: 'classic', twists: [], navboxes: false, timeLimit: 150}, {daily: d.date, dailyRepeat: !!done});
  }catch(e){ toast(e.message); }
}
function dailyShareText(){
  const d = store.get('daily', {})[todayStr()];
  if (!d) return '';
  const steps = d.won ? '🟦'.repeat(Math.min(19, Math.max(0, d.c - 1))) + '🎯' : '❌';
  return `Wiki Race Daily #${dailyNo()}\n${d.s} → ${d.t}\n${d.won ? `${plural(d.c, 'click')} · ${fmtTime(d.ms)}` : 'Did not make it'}\n${steps}\n${baseUrl()}`;
}

let CAT_EDIT = null;

  renderCatEditor(true);
}
function syncCatEditor(){
  if (!CAT_EDIT || !$('ceName')) return;
  CAT_EDIT.name = $('ceName').value.trim();

let SUGG_TIMER = null;
function catSuggest(input, ns){
  clearTimeout(SUGG_TIMER);
  const q = input.value;
  SUGG_TIMER = setTimeout(async () => {
    const lang = $('ceLang')?.value || SET.lang;
    const res = await W.suggest(lang, q, ns);
    const box = $('ceSugg'); if (!box || input.value !== q) return;
    box.innerHTML = res.slice(0, 8).map(t => { const v = ns === 14 ? t.replace(/^[^:]+:/, '') : t; return `<button data-act="cesugg" data-v="${esc(v)}">＋ ${esc(v)}</button>`; }).join('');
  }, 250);
}
async function catTest(){
  syncCatEditor();
  const out = $('ceTest');
  if (!CAT_EDIT.cat){ out.textContent = 'Type a category name first.'; return; }
  out.textContent = 'Checking…';
  try{
    const m = await W.catMembers(CAT_EDIT.lang, CAT_EDIT.cat, CAT_EDIT.sub);
    out.textContent = m.length ? `Found ${plural(m.length, 'article')}, for example ${shuffle(m).slice(0, 3).join(', ')}.` : 'No articles found. Check the spelling and the language.';
  }catch(e){ out.textContent = e.message; }
}
function catSave(){
  syncCatEditor();
  const c = CAT_EDIT, err = $('ceErr');
  if (!c.name){ err.textContent = 'Give your category a name.'; return; }
  if (c.kind === 'list'){
    c.items = [...new Map(c.items.map(t => [norm(t), t.slice(0, 200)])).values()].slice(0, 300);
    if (c.items.length < 2){ err.textContent = 'Add at least two articles.'; return; }
    delete c.cat; delete c.sub;
  } else {
    if (!c.cat){ err.textContent = 'Type the name of a Wikipedia category.'; return; }
    c.cat = c.cat.slice(0, 200); delete c.items;
  }
  const list = customCats();
  if (!c.id){ c.id = 'u' + Date.now().toString(36); c.hue = hashStr(c.id + c.name) % 360; list.push(c); }
  else { const i = list.findIndex(x => x.id === c.id); if (i >= 0) list[i] = c; else list.push(c); }
  store.set('cats', list);
  forgetPool(c.id);
  if (unlock('curator')) toast('🧩 Achievement unlocked: Curator');
  closeModal();
  toast(`Saved “${c.name}”. It is now in the From and To lists.`);
  if ($('srcPanel')){ SETUP.src = 'cats'; SETUP.from = c.id; saveSetup(); renderSrc(); newPair(); }
}
function catDelete(btn){
  if (!btn.dataset.armed){ btn.dataset.armed = '1'; btn.textContent = 'Tap again to delete'; return; }
  const id = CAT_EDIT.id;
  store.set('cats', customCats().filter(x => x.id !== id));
  forgetPool(id);
  if (SETUP.from === id) SETUP.from = 'food';
  if (SETUP.to === id) SETUP.to = 'space';
  saveSetup(); closeModal();
  if ($('srcPanel')) renderSrc();
  toast('Category deleted.');
}
function shareCat(id, btn){
  const c = customCats().find(x => x.id === id);
  if (!c) return;
  const d = {v: 1, n: c.name, e: c.emoji, k: c.kind, l: c.lang};
  if (c.kind === 'list') d.i = c.items.slice(0, 150); else { d.c = c.cat; d.s = c.sub ? 1 : 0; }
  copyText(`${baseUrl()}?cat=${b64urlEncode(d)}`, btn);
}
function cleanSharedCat(d){
  if (!d || typeof d !== 'object' || !d.n) return null;
  const lang = LANGS.some(l => l.code === d.l) ? d.l : 'en';
  const c = {name: String(d.n).slice(0, 40), emoji: String(d.e || '🗂️').slice(0, 4), lang, kind: d.k === 'wikicat' ? 'wikicat' : 'list'};
  if (c.kind === 'list'){
    c.items = (Array.isArray(d.i) ? d.i : []).map(x => String(x).trim().slice(0, 200)).filter(Boolean).slice(0, 300);
    if (c.items.length < 2) return null;
  } else {
    c.cat = String(d.c || '').slice(0, 200); c.sub = !!d.s;
    if (!c.cat) return null;
  }
  return c;
}
function offerSharedCat(c){
  openModal(`<h2>${esc(c.emoji)} Add “${esc(c.name)}”?</h2>
    <p class="lead">Someone shared a category with you. ${c.kind === 'list' ? `It has ${plural(c.items.length, 'article')} from ${esc(langName(c.lang))} Wikipedia, like ${c.items.slice(0, 4).map(esc).join(', ')}.` : `It uses the Wikipedia category “${esc(c.cat)}” on ${esc(langName(c.lang))} Wikipedia${c.sub ? ', with its subcategories' : ''}.`}</p>

let PENDING_CAT = null;
function acceptSharedCat(){
  const c = PENDING_CAT; if (!c) return;

function cleanChallenge(c){
  if (!c || typeof c !== 'object') return null;
  const str = (x, n) => typeof x === 'string' && x.trim() ? x.trim().slice(0, n) : '';
  const out = {v: 1, l: LANGS.some(l => l.code === c.l) ? c.l : 'en', s: str(c.s, 250), t: str(c.t, 250), m: MODES[c.m] ? c.m : 'classic',
    tl: TIME_LIMITS.includes(+c.tl) ? +c.tl : 150, w: (Array.isArray(c.w) ? c.w : []).filter(t => TWISTS[t]), nb: c.nb ? 1 : 0,
    n: str(c.n, 24), a: AVATARS.includes(c.a) ? c.a : ''};
  if (!out.s || !out.t) return null;
  if (c.k != null && c.k !== '' && Number.isFinite(+c.k) && +c.k >= 0){ out.k = Math.min(999, Math.floor(+c.k)); out.d = Math.max(0, Math.min(99999, Math.floor(+c.d || 0))); }
  if (Array.isArray(c.p)) out.p = c.p.slice(0, 30).map(x => String(x).slice(0, 200));
  return out;
}
